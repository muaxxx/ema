function repHead(title,sub){
  return `<div class="hd">
    <div><h1>EVA MARASSI — ${trText(title)}</h1><div class="sub">${trText(sub)}</div></div>
    <div class="iss">${trText('صدر في')}<br><b>${fmtT(Date.now())}</b> · ${opDay()}${USER?'<br>'+trText('بواسطة')+' '+USER:''}</div>
  </div>`;
}
function printDoc(title,body,preview){
  const en=LANG==='en';
  const ft=en?'EM · Marassi System — numbers directly from EVA':'EM · نظام مراسي v4.0 — الأرقام من إيفا مباشرة';
  const html=`<!doctype html><html lang="${en?'en':'ar'}" dir="${en?'ltr':'rtl'}"><head><meta charset="utf-8">
<title>${trText(title)} — ${DAY}</title><style>${REP_CSS}</style></head><body>${body}
<div class="ft"><span>${ft}</span><span>${DAY}</span></div>
</body></html>`;
  if(preview)return html;
  /* كروم يسمّي ملف PDF بعنوان الصفحة الأمّ — فنغيّره مؤقتاً ليصير الاسم واضحاً */
  const oldTitle=document.title;
  document.title=trText(title)+' · '+DAY+(USER?' · '+USER:'');
  const f=document.createElement('iframe');
  f.style.cssText='position:fixed;inset:0;width:0;height:0;border:0;opacity:0';
  document.body.appendChild(f);
  f.contentDocument.open();f.contentDocument.write(html);f.contentDocument.close();
  if(en){try{sweep(f.contentDocument.body)}catch(e){}}
  setTimeout(()=>{f.contentWindow.focus();f.contentWindow.print();
    setTimeout(()=>{f.remove();document.title=oldTitle},1500)},350);
}

/* ── تقرير التشغيل: حجوزات · أوقات · تأخير · خرائط (بلا أرقام مالية) ── */
function printOps(preview){
  const act=S.slots.filter(s=>!s._cancelled);
  const played=act.filter(s=>s._rounds);
  const late=played.filter(s=>s._setup>0);
  const short=played.filter(s=>s._deficit>0);
  const noShow=act.filter(s=>s._swallowed&&Date.now()>s._endT);
  const cancelled=S.slots.filter(s=>s._cancelled);
  const totDef=short.reduce((a,s)=>a+s._deficit,0);
  const totSetup=late.reduce((a,s)=>a+s._setup,0);
  const rounds=played.reduce((a,s)=>a+s._rounds,0);
  const players=played.reduce((a,s)=>a+(s.actual_players??s._actual??0),0);
  const playMin=Math.round(played.reduce((a,s)=>a+s._netSec,0)/60);
  const gmLine=S.gms.length?S.gms.map(g=>g.name+(g.break_start?` (بريك ${g.break_start}${g.break_end?'–'+g.break_end:''})`:'')).join(' · '):'—';
  const rows=timeline().map(it=>{
    if(it.walkin){const w=it.walkin;
      return `<tr class="walk"><td>${fmtT(w.start)}</td><td class="r">لعب بدون حجز${w.overCancelled?' <span class="mut">(بعد حجز ملغى)</span>':''}</td>
        <td>—</td><td>${w.players}</td><td>${fmtT(w.start)}</td><td>${w.net}د</td><td>—</td><td>—</td>
        <td class="mini">${[...new Set(w.games.map(g=>g.map).filter(Boolean))].join('، ')||'—'}</td></tr>`}
    const s=it.slot;
    if(s._cancelled)return `<tr class="cx"><td>${fmtT(s._t)}</td><td class="r">${s.account_name||'—'}</td>
      <td>${shortGame(s.game)}</td><td>${s.booked_players||0}</td><td colspan="5">أُلغي من إيفا</td></tr>`;
    const maps=[...new Set(s._games.map(g=>g.map).filter(Boolean))].join('، ');
    return `<tr>
      <td>${fmtT(s._t)}</td>
      <td class="r">${s.account_name||'—'}${staffBooked(s)?' <span class="mut">(موظف)</span>':''}${s.heard_from?'<div class="mini">'+s.heard_from+'</div>':''}</td>
      <td><span class="gp" style="background:${gameColor(s.game)}">${shortGame(s.game)}</span></td>
      <td>${s._rounds?`${s._actual}/${s.booked_players}`:(s.booked_players||0)}</td>
      <td>${s._rounds?fmtT(s._firstStart):(s._swallowed?'<b class="bad">لم يحضر</b>':'—')}</td>
      <td>${s._rounds?`${s._net}د`:'—'}</td>
      <td class="${s._setup?'warn':''}">${s._rounds?(s._setup?'+'+s._setup+'د':'✓'):'—'}</td>
      <td class="${s._deficit?'bad':'ok'}">${s._rounds?(s._deficit?'−'+s._deficit+'د':'سليم'):'—'}</td>
      <td class="mini">${(maps||'—')}${s.sale_note?' · <b>'+s.sale_note+'</b>':''}${s._mismatch?' · لاعبون غير مطابقين':''}</td></tr>`;
  }).join('');
  const body=repHead('تقرير التشغيل اليومي',`${DAY}${isSunday(DAY)?' · الأحد':''} · الطاقم: ${gmLine}`)
  +`<div class="tiles">
    <div class="tile"><div class="v">${act.length}</div><div class="l">حجوزات</div></div>
    <div class="tile"><div class="v" style="color:#127a48">${played.length}</div><div class="l">لُعبت</div></div>
    <div class="tile"><div class="v" style="color:${noShow.length?'#c22e3c':'#5a7183'}">${noShow.length}</div><div class="l">لم يحضر</div></div>
    <div class="tile"><div class="v" style="color:${cancelled.length?'#a97b0a':'#5a7183'}">${cancelled.length}</div><div class="l">أُلغيت</div></div>
    <div class="tile"><div class="v" style="color:${totDef?'#c22e3c':'#127a48'}">${totDef}د</div><div class="l">إجمالي النقص</div></div>
    <div class="tile"><div class="v" style="color:${totSetup?'#a97b0a':'#127a48'}">${totSetup}د</div><div class="l">تأخير التجهيز</div></div>
    <div class="tile"><div class="v">${rounds}</div><div class="l">جولات · ${playMin}د لعب</div></div>
    <div class="tile"><div class="v">${players}</div><div class="l">لاعبون</div></div>
  </div>
  <h2>حجوزات اليوم</h2>
  <table><tr><th>الوقت</th><th>الحساب</th><th>اللعبة</th><th>لعبوا</th><th>بدء</th><th>صافي اللعب</th><th>التجهيز</th><th>النقص</th><th>الخرائط</th></tr>${rows}</table>
  <div class="three">
    <div><h2>مسؤولية التأخير</h2>

/* ── تقرير المبيعات: أرقام مالية فقط ── */
function printSales(preview){
  const act=S.slots.filter(s=>!s._cancelled);
  const payT=new Map(PAYMENTS.map(p=>[p,0])),payN=new Map(PAYMENTS.map(p=>[p,0]));
  let unset=0,gross=0,disc=0,idx=0,rows='';
  for(const it of timeline()){
    if(it.walkin){const w=it.walkin;const rate=rateFor(new Date(w.start).toISOString(),DAY);const amt=w.players*rate;
      rows+=`<tr class="walk"><td>—</td><td>${fmtT(w.start)}</td><td>—</td><td class="r">لعب بدون حجز</td><td>—</td>
        <td>${w.players}</td><td>${rate.toFixed(2)}</td><td>${amt.toFixed(2)}</td><td>—</td><td>${amt.toFixed(2)}</td><td class="mut">تقديري</td><td class="r mut">—</td></tr>`;
      continue}
    const s=it.slot;
    if(s._cancelled){rows+=`<tr class="cx"><td>—</td><td>${fmtT(s._t)}</td><td>—</td><td class="r">${s.account_name||''}</td>
      <td>${shortGame(s.game)}</td><td colspan="7">أُلغي من إيفا — لا يُحصَّل</td></tr>`;continue}
    if(s._swallowed&&Date.now()>s._endT&&!s.pay_method){rows+=`<tr class="cx"><td>—</td><td>${fmtT(s._t)}</td><td>—</td>
      <td class="r">${s.account_name||''}</td><td>${shortGame(s.game)}</td><td colspan="7">لم يحضر — لا يُحصَّل</td></tr>`;continue}
    idx++;
    const c=saleCalc(s);gross+=c.amt;disc+=c.disc;
    const d0=DISCOUNTS.find(x=>x.code===discCode(s));
    rows+=`<tr><td>${idx}</td><td>${fmtT(s._t)}</td><td>${s.order_no||'—'}</td><td class="r">${s.account_name||'—'}</td>
      <td><span class="gp" style="background:${gameColor(s.game)}">${shortGame(s.game)}</span></td>
      <td>${(s.actual_players??s._actual??s.booked_players??0)}/${s.booked_players||0}</td>
      <td>${c.rate.toFixed(2)}</td><td>${c.amt.toFixed(2)}</td>
      <td>${c.disc?'−'+c.disc.toFixed(2):''}${d0&&d0.code?' <span class="mut">'+d0.label+'</span>':''}</td>
      <td><b>${c.net.toFixed(2)}</b></td>
      <td>${c.multi?'<span class="mut">مقسّم ↓</span>':(s.pay_method||'<b class="bad">بلا دفع</b>')}</td>
      <td class="r mut">${s.sale_note||'—'}</td></tr>`;
    for(const p of c.parts){
      if(!p.n)continue;
      if(p.pay&&payT.has(p.pay)){payT.set(p.pay,payT.get(p.pay)+p.net);payN.set(p.pay,payN.get(p.pay)+p.n)}
      else if(!p.pay)unset+=p.net;
      if(c.multi){
        const dd=DISCOUNTS.find(x=>x.code===p.code);
        rows+=`<tr class="sub"><td></td><td colspan="4" class="r">↳ ${p.name?'<b>'+p.name+'</b> · ':''}${p.n} لاعب · ${p.pay||'بلا طريقة دفع'}${dd&&dd.code?' · '+dd.label:''}</td>
          <td>${p.n}</td><td>${c.rate.toFixed(2)}</td><td>${p.amt.toFixed(2)}</td><td>${p.disc?'−'+p.disc.toFixed(2):''}</td>
          <td>${p.net.toFixed(2)}</td><td>${p.pay||'—'}</td><td></td></tr>`;
      }
    }
  }
  for(const x of (S.extras||[])){
    const a=+x.amount||0,d=DISCOUNTS.find(t=>t.code===(x.discount_code||''));
    const dv=(d&&d.pct!=null&&d.code)?+(a*d.pct/100).toFixed(2):0;
    gross+=a;disc+=dv;const v=a-dv;
    if(x.pay_method&&payT.has(x.pay_method)){payT.set(x.pay_method,payT.get(x.pay_method)+v);payN.set(x.pay_method,payN.get(x.pay_method)+1)}
    else unset+=v;
    rows+=`<tr class="walk"><td>ك</td><td>${x.at_time||''}</td><td>—</td><td class="r">café</td><td>—</td><td>1</td>
      <td>—</td><td>${a.toFixed(2)}</td><td>${dv?'−'+dv.toFixed(2):''}${d&&d.code?' <span class="mut">'+d.label+'</span>':''}</td>
      <td><b>${v.toFixed(2)}</b></td><td>${x.pay_method||'<b class="bad">بلا دفع</b>'}</td><td class="r mut">${x.note||'—'}</td></tr>`;
  }
  const net=gross-disc;
  const body=repHead('تقرير المبيعات اليومي',`${DAY}${isSunday(DAY)?' · الأحد':''} · التسعيرة: ${isSunday(DAY)?'٩٫٥٠ لليوم كامل':'٩٫٥٠ عادي · ١٢٫٥٠ بيك (17:00–21:40)'}`)
  +`<div class="tiles">
    <div class="tile"><div class="v">${gross.toFixed(2)}</div><div class="l">الإجمالي (BD)</div></div>
    <div class="tile"><div class="v" style="color:#a97b0a">−${disc.toFixed(2)}</div><div class="l">الخصومات</div></div>
    <div class="tile"><div class="v" style="color:#127a48">${net.toFixed(2)}</div><div class="l">الصافي (BD)</div></div>
    <div class="tile"><div class="v" style="color:${unset?'#c22e3c':'#127a48'}">${unset.toFixed(2)}</div><div class="l">غير محدد الدفع</div></div>
    <div class="tile"><div class="v">${idx}</div><div class="l">فواتير</div></div>
  </div>
  <h2>تفصيل المبيعات</h2>
  <table><tr><th>#</th><th>الوقت</th><th>رقم الطلب</th><th>الحساب</th><th>اللعبة</th><th>لعبوا/محجوز</th><th>الفرد</th><th>المبلغ</th><th>الخصم</th><th>الصافي</th><th>الدفع</th><th>ملاحظات</th></tr>
  ${rows}
  <tr class="tot"><th colspan="7">المجموع</th><th>${gross.toFixed(2)}</th><th>−${disc.toFixed(2)}</th><th>${net.toFixed(2)}</th><th colspan="2"></th></tr></table>
  <h2>مجموع الدفع</h2>
  <table><tr><th>الطريقة</th><th>عدد</th><th>المبلغ (BD)</th></tr>
  ${PAYMENTS.filter(p=>payN.get(p)>0).map(p=>`<tr><td class="r">${p}</td><td>${payN.get(p)}</td><td><b>${payT.get(p).toFixed(2)}</b></td></tr>`).join('')||'<tr><td colspan="3">—</td></tr>'}
  ${unset?`<tr><td class="r bad">غير محدد الدفع</td><td>—</td><td class="bad">${unset.toFixed(2)}</td></tr>`:''}
  <tr><th class="r">المجموع</th><th></th><th>${net.toFixed(2)}</th></tr></table>`;
  return printDoc('تقرير المبيعات',body,preview);
}

function staffWeek(p){try{return p&&p.week?JSON.parse(p.week):{}}catch(e){return{}}}
async function staffRename(id,name){
  name=(name||'').trim(); const p=S.staff.find(x=>x.id===id);
  if(!p||!name||p.name===name){renderGm();return}
  const old=p.name;
  try{
    await sbPatch('gm_staff',id,{name});
    const g=S.gms.find(x=>x.name===old);
    if(g&&g.id){try{await sbPatch('gm_shifts',g.id,{name});g.name=name;}catch(e){}}
    p.name=name; renderGm(); status('✓ عُدّل الاسم');
  }catch(e){status('⚠ '+e.message)}
}
async function setWeekShift(id,dow,label){
  const p=S.staff.find(x=>x.id===id); if(!p)return;
  const wk=staffWeek(p); if(label)wk[dow]=label; else delete wk[dow];
  const days=[]; for(let d=0;d<7;d++){if(wk[d]&&wk[d]!=='OFF')days.push(d);}
  try{
    await sbPatch('gm_staff',id,{week:JSON.stringify(wk),days:days.join(',')});
    p.week=JSON.stringify(wk); p.days=days.join(','); renderGm(); status('✓ حُفظ');
  }catch(e){status(/week|column/.test(e.message)?'⚠ شغّل ملف staff_week.sql في Supabase أولاً':'⚠ '+e.message)}
}
function printWeek(){
  const staff=S.staff||[];
  const order=[5,6,0,1,2,3,4];   // الجمعة → الخميس
  const css='<style>'
    +'.wk-title{text-align:center;margin-bottom:6px}.wk-title .t{font-size:26px;font-weight:900;color:#1a7a3c;letter-spacing:.5px}'
    +'.wk-title .s{color:#b8860b;letter-spacing:5px;font-weight:800;font-size:13px}'
    +'.wk-day{margin:14px 0 2px}.wk-day h3{display:inline-block;background:#1a7a3c;color:#fff;font-size:14px;font-weight:800;padding:6px 18px;border-radius:6px;margin:0}'
    +'.wk-cards{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px}'
    +'.wk-card{flex:1 1 150px;max-width:210px;border:1px solid #e2e8e3;border-top:3px solid #1a7a3c;border-radius:8px;padding:9px 12px;background:#fafcfa}'
    +'.wk-card.off{border-top-color:#c0392b}'
    +'.wk-card .nm{font-weight:800;font-size:14px;color:#1c2b22;margin-bottom:5px}'
    +'.wk-card .ln{font-size:11px;color:#5a6b60;margin-top:2px}.wk-card .ln b{color:#b8860b;font-weight:800}'
    +'.wk-card .offx{color:#c0392b;font-weight:900;letter-spacing:3px;font-size:13px}'
    +'.wk-note{text-align:center;color:#8a978e;font-size:10px;margin-top:16px;border-top:1px solid #eee;padding-top:8px}'
    +'</style>';
  const title='<div class="wk-title"><div class="t">Weekly Schedule</div><div class="s">EVA MARASSI</div></div>';
  let daysHtml='';
  for(const dow of order){
    const working=[];
    for(const p of staff){const sh=shiftByLabel(staffWeek(p)[dow]); if(sh)working.push({name:p.name,s:sh.s,e:sh.e});}
    const brs=new Map(computeDayBreaks(working).map(b=>[b.name,b]));
    let cards='';
    for(const p of staff){
      const lbl=staffWeek(p)[dow], sh=shiftByLabel(lbl);
      if(sh){const b=brs.get(p.name);
        cards+='<div class="wk-card"><div class="nm">'+rEsc(p.name)+'</div>'
          +'<div class="ln">Shift <b>'+fmtHM12(sh.s)+' – '+fmtHM12(sh.e)+'</b></div>'
          +'<div class="ln">Break <b>'+fmtHM12(b.bs)+' – '+fmtHM12(b.be)+'</b></div></div>';
      }else if(lbl==='OFF'){
        cards+='<div class="wk-card off"><div class="nm">'+rEsc(p.name)+'</div><div class="offx">OFF</div></div>';
      }
    }
    if(!cards)continue;
    daysHtml+='<div class="wk-day"><h3>'+EN_DAY[dow]+'</h3><div class="wk-cards">'+cards+'</div></div>';
  }
  if(!daysHtml)daysHtml='<div class="wk-note">لا مواعيد مُدخَلة بعد — اختر ورديات الموظفين في الجدول أدناه</div>';
  const note='<div class="wk-note">Break is placed at the mid-point of each shift · overlapping breaks are pushed back by one hour</div>';
  return printDoc('Weekly Schedule','<div dir="ltr">'+css+title+daysHtml+note+'</div>');
}
async function staffSet(id,field,v){
  try{await sbPatch('gm_staff',id,{[field]:v||null});const p=S.staff.find(x=>x.id===id);if(p)p[field]=v||null;renderGm();status('✓ حُفظ')}
  catch(e){status(/role|days|shift/.test(e.message)?'⚠ شغّل ملف eva_v4.sql في Supabase أولاً (أعمدة الموظفين)':'⚠ '+e.message)}
}
async function staffDay(id,day,on){
  const p=S.staff.find(x=>x.id===id);if(!p)return;
  const set=new Set((p.days||'').split(',').filter(Boolean));
  on?set.add(String(day)):set.delete(String(day));
  const days=[...set].sort().join(',');
  try{await sbPatch('gm_staff',id,{days:days||null});p.days=days;renderGm();status('✓ حُفظ جدول العمل')}
  catch(e){status(/days|column/.test(e.message)?'⚠ شغّل ملف eva_v4.sql في Supabase أولاً':'⚠ '+e.message)}
}
async function gmToggle(name,on){
  try{
    if(on)await sbUpsert('gm_shifts',{day:DAY,name},'day,name');
    else await sbDelete('gm_shifts',`day=eq.${DAY}&name=eq.${encodeURIComponent(name)}`);
    await reloadGms();status('✓ حُدّث طاقم اليوم');
  }catch(e){status('⚠ '+e.message)}
}
async function gmBreak(name,field,v){
  try{
    const cur=S.gms.find(g=>g.name===name)||{};
    await sbUpsert('gm_shifts',{day:DAY,name,break_start:field==='break_start'?(v||null):cur.break_start,break_end:field==='break_end'?(v||null):cur.break_end},'day,name');
    await reloadGms();status('✓ حُفظ البريك');
  }catch(e){status('⚠ '+e.message)}
}
async function gmCopyYesterday(){
  try{
    const d=new Date(DAY+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-1);
    const y=d.toISOString().slice(0,10);
    const prev=await sbGet(`gm_shifts?day=eq.${y}&select=name,break_start,break_end`);
    if(!prev.length){status('لا طاقم مسجّل أمس');return}
    await sbUpsert('gm_shifts',prev.map(p=>({day:DAY,...p})),'day,name');
    await reloadGms();status(`✓ نُسخ طاقم أمس (${prev.length})`);
  }catch(e){status('⚠ '+e.message)}
}
async function gmAddStaff(){
  const inp=document.getElementById('gmNewName');
  const name=(inp.value||'').trim();
  if(!name)return;
  const role=(document.getElementById('gmNewRole')||{}).value||null;
  try{await sbInsert('gm_staff',{name,role});
    S.staff=await sbGet(`gm_staff?select=*&order=name`);renderGm();status('✓ أُضيف '+name)}
  catch(e){status(/gm_staff/.test(e.message)?'⚠ شغّل eva_v3.sql في Supabase أولاً':'⚠ '+e.message)}
}
async function gmDelStaff(id,name){
  if(!confirm((LANG==='en'?'Delete ':'حذف ')+name+'؟'))return;
  try{await sbDelete('gm_staff',`id=eq.${id}`);
    await sbDelete('gm_shifts',`day=eq.${DAY}&name=eq.${encodeURIComponent(name)}`).catch(()=>{});
    S.staff=S.staff.filter(p=>p.id!==id);await reloadGms();status('✓ حُذف '+name)}
  catch(e){status('⚠ '+e.message)}
}
async function reloadGms(){
  S.gms=await sbGet(`gm_shifts?day=eq.${DAY}&select=*`).catch(()=>[]);
  compute();renderAll();
}

let LANG=localStorage.getItem('em_lang')||'ar';
function toggleLang(){LANG=LANG==='ar'?'en':'ar';localStorage.setItem('em_lang',LANG);applyLang()}
function applyLang(){
  document.documentElement.lang=LANG;
  document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  const b=document.getElementById('langBtn');if(b)b.textContent=LANG==='ar'?'EN':'ع';
  if(loadedOnce)renderAll();
  sweep(document.body);   // يشمل شاشة الدخول والهيدر (خارج main)
}
function trText(s){
  if(LANG!=='en')return s;
  if(EN[s]!=null)return EN[s];
  for(const[rx,rep]of EN_RX){if(rx.test(s))return s.replace(rx,rep)}
  return s;
}
function sweep(root){
  if(LANG!=='en'||!root)return;
  const w=(root.ownerDocument||document).createTreeWalker(root,NodeFilter.SHOW_TEXT);
  let n;
  while(n=w.nextNode()){
    const s=n.nodeValue.trim();
    if(!s||!/[؀-ۿ]/.test(s))continue;
    const t=trText(s);
    if(t!==s)n.nodeValue=n.nodeValue.replace(s,t);
  }
  root.querySelectorAll('[placeholder]').forEach(i=>{const p=i.getAttribute('placeholder');if(EN[p])i.setAttribute('placeholder',EN[p])});
  root.querySelectorAll('option').forEach(o=>{const s=o.textContent.trim();if(EN[s])o.textContent=EN[s]});
}

/* ═════════ النتائج (بطاقات بأسلوب EVA) ═════════ */
function rEsc(s){return String(s==null?'':s).replace(/[<>&]/g,c=>c==='<'?'&lt;':c==='>'?'&gt;':'&amp;')}
function rH12(t){let[H,M]=String(t).split(':').map(Number);const ap=H<12?'AM':'PM';H=H%12||12;return H+':'+String(M||0).padStart(2,'0')+' '+ap}
function rDur(sec){sec=Math.max(0,Math.round(+sec||0));const m=Math.floor(sec/60),s=sec%60;return m+'M'+String(s).padStart(2,'0')+'S'}
function rEmblem(kind){
  const id='em_'+kind;
  const stops=kind==='gold'?'<stop offset="0" stop-color="#ffcf5c"/><stop offset="1" stop-color="#df8500"/>':'<stop offset="0" stop-color="#74d2f9"/><stop offset="1" stop-color="#1c7ec0"/>';
  return '<svg class="rlogo" viewBox="0 0 72 72"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="1" y2="1">'+stops+'</linearGradient></defs>'
    +'<circle cx="36" cy="36" r="33" fill="url(#'+id+')"/>'
    +'<path d="M36 11 A25 25 0 1 0 61 36" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" opacity=".96"/>'
    +'<circle cx="36" cy="11" r="6.5" fill="#fff"/><circle cx="36" cy="36" r="4.5" fill="#fff" opacity=".92"/></svg>';
}

  if(!games.length){el.innerHTML='<div class="empty">لا نتائج مرصودة اليوم بعد</div>';return}
  el.innerHTML='<div class="rwrap">'
    +'<div class="row" style="align-items:flex-end;margin-bottom:18px">'
      +'<div class="rtoptitle"><h1>🏆 نتائج آخر المباريات</h1><div class="loc">EVA MARASSI - 1</div></div>'
      +'<span class="grow"></span><span class="dim sm">'+games.length+' مباراة · '+DAY+'</span></div>'
    +games.map((g,i)=>resultCard(g,i)).join('')+'</div>';
  sweep(el);
}
function resultCard(g,i){
  const ps=g.players||[];
  const teams=[...new Set(ps.map(p=>p.team).filter(x=>x!=null))];
  const k1=g.team_one!=null?g.team_one:teams[0];
  const k2=g.team_two!=null?g.team_two:teams[1];
  let A=ps.filter(p=>p.team===k1), B=ps.filter(p=>p.team===k2);
  if(!A.length&&!B.length){const h=Math.ceil(ps.length/2);A=ps.slice(0,h);B=ps.slice(h)}
  const s1=g.team_one_score, s2=g.team_two_score;
  const n1=(k1!=null?String(k1):'ALLIANCE').toUpperCase(), n2=(k2!=null?String(k2):'REBELS').toUpperCase();
  const pctMode=(s1!=null&&s2!=null&&s1<=100&&s2<=100);
  const fp=v=>v==null?'-':(pctMode?v+'%':v);
  const tbl=(list,cls)=>{
    const rows=list.slice().sort((a,b)=>b.score-a.score).map(p=>
      '<div class="rrow"><span class="rpn"><span class="pn">'+rEsc(p.name)+'</span>'+(p.mvp?'<span class="rmvpb"><span class="cr">\u265B</span>MVP</span>':'')+'</span><span class="rkda">'+p.kills+' / '+p.deaths+' / '+p.assists+'</span><span class="rscn">'+p.score+'</span></div>').join('')
      ||'<div class="rrow"><span class="rpn dim sm">\u2014</span></div>';
    return '<div class="rtbl '+cls+'"><div class="rthd"><div class="rseg pl">PLAYER</div><div class="rseg kd">K / D / A</div><div class="rseg sch">SCORE</div></div>'+rows+'</div>';
  };
  const gname=g.cc?'COLOR CHAOS':'BATTLE ARENA';
  const mapU=rEsc((g.map||'\u2014')).toUpperCase();
  const d=String(DAY).split('-'); const dstr=(+d[1])+'/'+(+d[2])+'/'+String(d[0]).slice(2);
  const cal='<svg viewBox="0 0 24 24" fill="none" stroke="#cfe0ff" stroke-width="2"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>';
  const clk='<svg viewBox="0 0 24 24" fill="none" stroke="#cfe0ff" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  const wm='<svg class="rwm" viewBox="0 0 640 520"><g fill="none" stroke="#dfe5ee" stroke-width="46"><path d="M70 500 L330 70 L590 500"/><path d="M170 500 L330 250 L470 500"/></g></svg>';
  return '<div class="rcard">'+wm
   +'<button class="rdl" onclick="rDownload('+i+')">\u2B07 PNG</button>'
   +'<div class="rhead">'
     +'<div class="rbrand"><div class="b1">AFTER<i>\u00B7</i>H</div><div class="b2">BATTLE ARENA</div><div class="b3">EVA ORIGINAL GAME</div></div>'
     +'<div class="rmid"><div class="sub">'+gname+'</div><div class="mode">'+mapU+'</div></div>'
     +'<div class="rdt"><div>'+cal+dstr+'</div><div>'+clk+rH12(fmtT(g.end))+'</div></div>'
   +'</div>'
   +'<div class="rscore"><div class="rgrp">'
     +'<div class="rside a">'+rEmblem('gold')+'<span class="rnm">'+n1+'</span></div>'
     +'<span class="rpct">'+fp(s1)+'</span><span class="rvs">VS</span><span class="rpct">'+fp(s2)+'</span>'
     +'<div class="rside b">'+rEmblem('blue')+'<span class="rnm">'+n2+'</span></div>'
   +'</div></div>'
   +'<div class="rtables">'+tbl(A,'a')+tbl(B,'b')+'</div></div>';
}

function rCollectCSS(){
  let out='';
  for(const sh of document.styleSheets){
    let rules; try{rules=sh.cssRules||sh.rules}catch(e){continue}
    if(!rules)continue;
    for(const r of rules){const t=r.cssText||''; if(/\.(r[a-z]|crown|glogo|dim|row|grow|empty)/.test(t))out+=t+'\n';}
  }
  return out;
}
function rDownload(idx){
  try{
    const card=document.querySelectorAll('#tab-res .rcard')[idx];
    if(!card){status('⚠ لا توجد بطاقة');return}
    const w=Math.ceil(card.offsetWidth), h=Math.ceil(card.offsetHeight), sc=2;
    const clone=card.cloneNode(true); clone.style.margin='0';
    const dl=clone.querySelector('.rdl'); if(dl)dl.remove();
    const body='<div xmlns="http://www.w3.org/1999/xhtml" style="direction:ltr;width:'+w+'px"><style>'+rCollectCSS()+'</style>'+new XMLSerializer().serializeToString(clone)+'</div>';
    const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+(w*sc)+'" height="'+(h*sc)+'" viewBox="0 0 '+w+' '+h+'"><foreignObject x="0" y="0" width="'+w+'" height="'+h+'">'+body+'</foreignObject></svg>';
    const img=new Image();
    img.onload=function(){
      const c=document.createElement('canvas'); c.width=w*sc; c.height=h*sc;
      c.getContext('2d').drawImage(img,0,0,w*sc,h*sc);
      c.toBlob(function(b){ if(!b){status('⚠ تعذّر إنشاء الصورة');return}
        const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='EVA-MARASSI-result.png'; a.click(); status('✓ نُزّلت الصورة'); },'image/png');
    };
    img.onerror=function(){ status('⚠ تعذّر توليد الصورة'); };
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  }catch(e){ status('⚠ '+e.message); }
}
