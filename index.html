<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EM · نظام إيفا مراسي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ═══ EM v2.2 — ثيم فاتح · Tajawal · بطاقات ملوّنة كإيفا ═══ */
:root{
  /* لوحة إيفا: خلفية بيضاء مزرقّة + بلوكات صلبة + تباين قوي */
  --bg:#e7eff6; --card:#ffffff; --card2:#e8f2f8; --line:#d6e4ee; --line2:#c3d7e4;
  --ink:#102331; --dim:#49637a; --teal:#1a92a6; --teal-d:#115e6d;
  --pink:#c2338f; --blue:#2b87e3; --green:#1fae68; --purple:#8b55e8;
  --amber:#d29a1c; --red:#e04b59; --orange:#e8862e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:15px/1.65 'Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif;padding-bottom:64px;min-height:100vh}
header{position:sticky;top:0;z-index:50;background:#ffffffd9;border-bottom:1px solid var(--line2);backdrop-filter:blur(10px)}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;color:var(--teal-d)}
.brand small{color:var(--dim);font-weight:500}
.datenav{display:flex;align-items:center;gap:5px;margin-inline-start:auto}
.datenav button,.btn{background:#fff;color:var(--ink);border:1px solid var(--line2);border-radius:9px;padding:5px 12px;cursor:pointer;font:700 13px 'Tajawal',system-ui;transition:.15s;box-shadow:0 1px 2px rgba(27,42,56,.05)}
.datenav input{background:#fff;color:var(--ink);border:1px solid var(--line2);border-radius:9px;padding:4px 8px;font:700 13px 'Tajawal',system-ui}
.btn:hover,.datenav button:hover{border-color:var(--teal);transform:translateY(-1px)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff;font-weight:800}
.btn.ghost{background:none;box-shadow:none}
nav{display:flex;gap:2px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
nav button{background:none;border:none;color:var(--dim);font:800 14px 'Tajawal',system-ui;padding:9px 15px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--teal-d);border-color:var(--teal)}
nav button .badge{background:var(--red);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;margin-inline-start:4px}
main{max-width:1100px;margin:0 auto;padding:16px}
body.wide main{max-width:1560px}
/* نافذة تقسيم الدفع */
.ovl{position:fixed;inset:0;background:#000000bb;z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:16px 18px;max-width:560px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.dlg h3{font-size:16px;margin-bottom:4px}
.splitrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line2);flex-wrap:wrap}
.splitrow .n{width:64px}
.rem{background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;margin-top:10px}
.noteb{background:none;border:1px dashed var(--line2);border-radius:7px;color:var(--dim);cursor:pointer;padding:2px 8px;font:12.5px 'Tajawal';max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.noteb.has{color:var(--ink);border-style:solid;border-color:var(--teal-d)}
/* بوابة الدخول */
.gate{position:fixed;inset:0;z-index:500;background:#0b1016;display:flex;align-items:center;justify-content:center;padding:20px}
.gatebox{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:26px 30px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);max-width:420px;width:100%}
.gtitle{font-size:22px;font-weight:800;color:var(--teal)}
.ubtn{background:var(--card2);border:2px solid var(--line2);border-radius:12px;padding:9px 16px;cursor:pointer;color:var(--ink);font:800 14px 'Tajawal';margin:3px}
.ubtn.on{border-color:var(--teal);background:#12303a;color:#fff}
body.locked{overflow:hidden}
#who{font-size:12.5px;color:var(--dim)}
.tab{display:none}.tab.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
h2{font-size:15px;color:var(--dim);margin:20px 0 10px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:13px 16px;margin-bottom:10px;border-inline-start:5px solid var(--dim);box-shadow:0 2px 8px rgba(27,42,56,.06)}
.hero{background:linear-gradient(135deg,#fff,#f2f7fb);border:1px solid var(--line2);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 16px rgba(27,42,56,.08)}
.hero .big{font-size:20px;font-weight:800}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line2);border-radius:999px;padding:1px 11px;font-size:12px;color:var(--dim);font-weight:700}
.chip.warn{color:var(--amber);border-color:#eBD48b;background:#fdf6e2}
.chip.ok{color:#127a48;border-color:#b9e4cd;background:#ecf9f2}
.chip.bad{color:#c22e3c;border-color:#f3c2c7;background:#fdeef0}
.chip.info{color:#1d6dbd;border-color:#bcd9f5;background:#ecf4fd}
.chip .x{cursor:pointer;opacity:.6;font-weight:800;margin-inline-start:2px}
.chip .x:hover{opacity:1;color:var(--red)}
.t{color:var(--teal-d);font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.dim{color:var(--dim)}.sm{font-size:12.5px}
.empty{color:var(--dim);text-align:center;padding:28px;background:var(--card);border:1px dashed var(--line2);border-radius:14px}
footer{position:fixed;bottom:0;inset-inline:0;background:#ffffffd9;border-top:1px solid var(--line2);padding:7px 16px;font-size:12.5px;color:var(--dim);display:flex;gap:14px;backdrop-filter:blur(10px)}
.flash{animation:fl 1.6s ease 2}
@keyframes fl{0%,100%{background:var(--card)}50%{background:#dff1f5}}
/* شريط اللعب داخل بطاقة التفاصيل */
.bar{position:relative;height:12px;background:#e6edf4;border-radius:8px;margin:8px 0 4px;overflow:hidden;border:1px solid var(--line2)}
.bar .seg{position:absolute;top:0;bottom:0;border-radius:8px}
.bar .setup{background:repeating-linear-gradient(45deg,#eBD48b,#eBD48b 5px,#f6e8bd 5px,#f6e8bd 10px)}
.bar .play{background:linear-gradient(90deg,var(--teal-d),var(--teal))}
.bar .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--red)}
.barlbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-bottom:8px;flex-wrap:wrap;gap:4px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px;margin:10px 0 6px}
.metric{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 10px;text-align:center}
.metric.hl{border-color:#a8d8e2;background:#e9f6f9}
.metric .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.metric .l{font-size:11.5px;color:var(--dim);margin-top:1px}
.metric .s{font-size:11px;color:var(--dim)}
.rounds{margin-top:9px;border-top:1px dashed var(--line2);padding-top:9px;display:flex;flex-direction:column;gap:4px}
.round{display:flex;gap:8px;align-items:center;font-size:13px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
/* رحلة العميل */
.journey{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:var(--card2);border:1px solid var(--line2);
  border-radius:10px;padding:7px 11px;margin-top:9px;font-size:12.5px}
.journey .jst{color:var(--dim)}
.journey .jst.on{color:var(--ink)}
.journey .jst b{color:var(--dim);font-weight:700}
.journey .jst.on b{color:var(--teal)}
.journey .jst.warn{color:var(--amber)}
.journey .jar{color:var(--line2)}
/* الخرائط والأزمنة — الأهم في البطاقة */
.maps{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.mapc{flex:1 1 168px;background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:9px 11px;border-inline-start:5px solid var(--gc,var(--teal))}
.mapc .mp{font-weight:800;font-size:14.5px;letter-spacing:.2px}
.mapc .dur{font-size:21px;font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;line-height:1.15}
.mapc .tm{font-size:12px;color:var(--dim);direction:ltr;unicode-bidi:isolate}
.mapc .sc{font-size:11.5px;color:var(--dim)}
.gapc{flex:0 0 62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-size:11px;line-height:1.25;color:var(--amber);background:#1e1a10;border:1px dashed #4a3d18;border-radius:10px;padding:4px 2px}
.gapc b{font-size:12.5px;font-variant-numeric:tabular-nums;direction:ltr}
/* اللاعبون — مضغوطون في أعمدة */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:1px 12px;margin-top:5px}
.pgrid .prow{padding:2px 7px;font-size:12.5px}
.pgrid .prow .score{min-width:44px;font-size:12.5px}
.pgrid .prow .kda{font-size:11px}
.plist{margin-top:9px;border-top:1px dashed var(--line2);padding-top:8px}
.prow{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:9px;font-size:13px}
.prow:nth-child(even){background:#f2f7fb}
.prow .score{color:var(--teal-d);font-weight:800;min-width:52px;text-align:left;direction:ltr}
.prow .kda{color:var(--dim);font-size:12px;direction:ltr;unicode-bidi:isolate}
.mvp{background:linear-gradient(90deg,#d4af37,#f1c40f);color:#5b4503;font-size:10px;font-weight:800;border-radius:6px;padding:0 6px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--teal-d);color:#fff;font-weight:800;text-align:right;padding:8px 10px;font-size:12.5px;white-space:nowrap}
th:first-child{border-radius:0 10px 10px 0}th:last-child{border-radius:10px 0 0 10px}
[dir=ltr] th{text-align:left}
[dir=ltr] th:first-child{border-radius:10px 0 0 10px}[dir=ltr] th:last-child{border-radius:0 10px 10px 0}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
tr.total td{font-weight:800;border-top:2px solid var(--line2);background:var(--card2)}
tr.walkin td{background:#fdf6e2}
tr.cancelled td,.card.cancelled{opacity:.55}
.disc{width:64px;background:#fff;color:var(--ink);border:1px solid var(--line2);border-radius:7px;padding:3px 6px;font:700 13px 'Tajawal';text-align:center}
select.disc-sel{background:#fff;color:var(--ink);border:1.5px solid var(--line2);border-radius:8px;padding:4px 6px;font:700 12.5px 'Tajawal';min-width:108px;cursor:pointer}
select.disc-sel:hover{border-color:var(--teal)}
.xmail{width:170px;background:#fff;color:var(--ink);border:1px solid var(--line2);border-radius:7px;padding:3px 8px;font:13px 'Tajawal';direction:ltr}
.cnt{width:56px;background:#fff;color:var(--ink);border:1px solid var(--line2);border-radius:7px;padding:3px 6px;font:800 14px 'Tajawal';text-align:center}
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:4px 8px;box-shadow:0 2px 8px rgba(27,42,56,.06)}
input[type=time]{background:#fff;color:var(--ink);border:1px solid var(--line2);border-radius:7px;padding:3px 6px;font:700 13px 'Tajawal'}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--teal)}
/* ── بلوك حجز صلب بنص أبيض (كجدول إيفا) ── */
.evablock{border:none;border-radius:12px;padding:11px 15px;margin-bottom:8px;color:#fff;box-shadow:0 2px 8px rgba(23,48,66,.18)}
.evablock .t,.evablock .dim{color:#fff}
.evablock .dim{opacity:.85}
.evablock .wchip{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.22);border-radius:999px;padding:1px 11px;font-size:12px;color:#fff;font-weight:700}
.evablock .wchip.solid{background:#fff;color:var(--ink)}
.evablock .wchip.alarm{background:#ffffff;color:#c22e3c}
/* رأس بطاقة التفاصيل بلون اللعبة الصلب */
.dstrip{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 15px;border-radius:12px 12px 0 0;color:#fff}
.dstrip .t{color:#fff;font-size:18px}
.dstrip .wchip{background:rgba(255,255,255,.2);border-radius:999px;padding:2px 12px;font-size:11.5px;font-weight:600;opacity:.95}
.dstrip .wchip b{font-weight:800;font-size:13.5px;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;margin-inline-start:3px}
.dstrip .wchip.alarm,.dstrip .wchip.solid{font-weight:800;font-size:12.5px}
.dwrap{background:#fff;border:1px solid var(--line2);border-radius:14px;margin-bottom:14px;overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,.35);border-inline-start:6px solid var(--gc,var(--teal))}
.dwrap.open{box-shadow:0 10px 26px rgba(0,0,0,.45)}
.dwrap .dbody{padding:12px 15px;border-top:1px solid var(--line2)}
.dstrip{cursor:pointer;user-select:none}
.dstrip:hover{filter:brightness(1.09)}
.chev{transition:transform .18s;font-size:15px;opacity:.85}
.dwrap.open .chev{transform:rotate(180deg)}
.anagrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
@media(max-width:1100px){.anagrid{grid-template-columns:1fr}}
.anagrid .dwrap{margin-bottom:0}
.anagrid>h2,.anagrid>.hero{grid-column:1/-1;margin-bottom:0}
.anagrid>.card{margin-bottom:0}
.anagrid .dcols{grid-template-columns:1fr;gap:12px}
.anagrid .metrics{grid-template-columns:repeat(4,1fr)}
.anagrid .mapc{flex:1 1 128px}
.anagrid .pgrid{grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}
/* جدول التسجيلات: يملأ العرض بلا تمرير أفقي */
#tab-rec .tblwrap{overflow:visible}
#tab-rec table{table-layout:auto;width:100%}
#tab-rec td,#tab-rec th{white-space:normal}
#tab-rec .xmail{width:100%;min-width:120px}
#tab-rec .chip{white-space:nowrap}
.dcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media(max-width:940px){.dcols{grid-template-columns:1fr}}
.dcol{min-width:0}
.secttl{font-size:11.5px;color:var(--teal);font-weight:800;letter-spacing:.3px;margin:0 0 7px;padding-bottom:4px;border-bottom:1px solid var(--line2)}
.dcol .maps{margin-top:0}
.dcol .mapc{flex:1 1 140px}
.dcol .metrics{grid-template-columns:repeat(2,1fr)}
.anabar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.stafflist{display:flex;flex-direction:column;gap:7px;margin-bottom:6px}
.staffrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line2);
  border-inline-start:5px solid var(--line2);border-radius:12px;padding:9px 13px}
.staffrow.on{border-inline-start-color:var(--teal);background:#12262e}
.rolechip{font-size:11px;border-radius:999px;padding:1px 10px;background:var(--card2);color:var(--dim);border:1px solid var(--line2)}
.rolechip.r-gm{color:#6ab2f7;border-color:#1e3a5a}
.rolechip.r-reception{color:#3fd58a;border-color:#1e4a2e}
.rolechip.r-cashier{color:#e0b64a;border-color:#5a4a1e}
.rolechip.r-tech{color:#a06bff;border-color:#3a2a5a}
.rolechip.r-super{color:#ff6b78;border-color:#5a2a2e}
.rolechip.r-cafe{color:#ff8a3d;border-color:#5a3a1e}
.catbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.catbtn{background:var(--card2);border:1px solid var(--line2);border-radius:999px;padding:6px 16px;cursor:pointer;color:var(--dim);font:700 13px 'Tajawal'}
.catbtn.on{background:var(--teal-d);border-color:#0e6c7d;color:#fff}
.menugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mbtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--card);border:1px solid var(--line2);
  border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink);text-align:start;transition:.15s;font-family:'Tajawal'}
.mbtn:hover{border-color:var(--teal);transform:translateY(-2px);background:#152430}
.mbtn .mn{font-size:12.5px;font-weight:700;line-height:1.3}
.mbtn .mp{font-size:15px;color:var(--teal);font-variant-numeric:tabular-nums;direction:ltr}
.lin .qty{min-width:26px;text-align:center;font-weight:800}
/* ═══ لوحة التشغيل ═══ */
.opsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:11px;margin-bottom:6px}
.opsnow,.opscard{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:14px 16px;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.opsnow{grid-column:span 2;background:linear-gradient(135deg,#13202b,#161d26);border-inline-start:6px solid var(--teal)}
.opsnow.ok{border-inline-start-color:var(--green)}
.opsnow.warn{border-inline-start-color:var(--amber)}
.opslbl{font-size:11.5px;color:var(--dim);font-weight:700;letter-spacing:.3px;margin-bottom:5px}
.opsbig{font-size:20px;font-weight:800;line-height:1.3}
.opsbig2{font-size:17px;font-weight:800}
.opssub{font-size:12.5px;color:var(--dim);margin-top:3px}
.opsstats{display:flex;gap:14px;flex-wrap:wrap}
.opsstats div{display:flex;flex-direction:column}
.opsstats b{font-size:20px;font-variant-numeric:tabular-nums}
.opsstats b.bad{color:var(--red)}.opsstats b.ok{color:var(--green)}
.opsstats span{font-size:11px;color:var(--dim)}
.strip{display:flex;gap:5px;flex-wrap:wrap}
.tick{flex:1 1 74px;min-width:74px;border-radius:10px;padding:7px 6px;text-align:center;cursor:pointer;
  border:1px solid var(--line2);background:var(--card);transition:.15s}
.tick:hover{transform:translateY(-2px)}
.tick span{display:block;font-size:11.5px;color:var(--dim);direction:ltr}
.tick b{display:block;font-size:12.5px;margin-top:2px}
.tick.good{background:color-mix(in srgb,var(--gc) 26%,#0e1319);border-color:var(--gc)}
.tick.short{background:#2a1418;border-color:#7a2b35;color:#ff9aa4}
.tick.now{background:linear-gradient(135deg,color-mix(in srgb,var(--gc) 55%,#0e1319),color-mix(in srgb,var(--gc) 25%,#0e1319));border-color:var(--gc);color:#fff}
.tick.soon{opacity:.75}
.tick.noplay,.tick.idle{opacity:.5}
.tick.noshow{background:#2a1418;border-color:#7a2b35}
.tick.cx{opacity:.35;text-decoration:line-through}
.tick.walkin{background:#241d0d;border-color:#5a4a1e;color:var(--amber)}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{padding:8px 12px;border-radius:10px;font-size:13px;border-inline-start:4px solid var(--line2);background:var(--card)}
.alert.bad{border-inline-start-color:var(--red);background:#1e1214;color:#ffb3ba}
.alert.warn{border-inline-start-color:var(--amber);background:#1e1a10;color:#f0c98a}
/* ═══ المبيعات كنظام محاسبي: فواتير + لوحة تحصيل ═══ */
.acc{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
@media(max-width:1000px){.acc{grid-template-columns:1fr}}
.inv{background:var(--card);border:1px solid var(--line2);border-radius:14px;margin-bottom:10px;overflow:hidden;
  border-inline-start:5px solid var(--gc,var(--line2));box-shadow:0 3px 12px rgba(0,0,0,.28)}
.inv.due{border-inline-start-color:var(--red)}
.inv.void{opacity:.5}
.inv.walk{border-inline-start-color:var(--amber);background:#1d1a12}
.inv.cafe{border-inline-start-color:var(--amber)}
.invh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:#131b24}
.invh .num{color:var(--dim);font-weight:800;min-width:26px}

const pad=n=>String(n).padStart(2,'0');
const loc=t=>new Date(new Date(t).getTime()+SHIFT);

const mmss=sec=>{sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+':'+pad(sec%60)};
function opDay(){const d=new Date(Date.now()+SHIFT);if(d.getUTCHours()<2)d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10)}

function hmToTs(hm){if(!hm)return null;let t=Date.parse(DAY+'T'+hm+':00Z')-SHIFT;if(hm<'06:00')t+=86400e3;return t}

function gameName(g){const m=/^gameId (\d+)$/.exec(g||'');return m?(GID[m[1]]||g):(g||'—')}
/* ألوان إيفا نفسها (من جدول admin.eva.gg): باتل تيل · مون ماجنتا */
function gameColor(g){const n=(gameName(g)).toUpperCase();
  if(n.includes('MOON'))return'#c2338f';
  if(n.includes('CHAOS')||n.includes('RABBIDS'))return'#2b87e3';

  if(n.includes('MARS'))return'#d29a1c';
  if(n.includes('KARTING'))return'#e8862e';

/* خلفية البطاقة بلون اللعبة (كطريقة إيفا) */
function tint(col,p){return `color-mix(in srgb, ${col} ${p||10}%, white)`}

/* ═════════ التسعيرة ═════════ */
function rateFor(startAt,day){
  if(isSunday(day))return 9.5;
  const d=loc(startAt),t=d.getUTCHours()*60+d.getUTCMinutes();
  return (t>=17*60 && t<22*60+20) ? 12.5 : 9.5;
}

let DAY=opDay(), TAB='rcp';
let S={slots:[],rounds:[],dayRounds:[],walkins:[],firstSeen:new Map(),dir:new Map(),gms:[],staff:[],extras:[],stock:[],gmMissing:false};

async function sbGet(path){const r=await fetch(SB+'/rest/v1/'+path,{headers:H});if(!r.ok)throw new Error(path.split('?')[0]+': '+(await r.text()).slice(0,140));return r.json()}
async function sbPatch(table,id,body){

    headers:{...H,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(body)});

}

    headers:{...H,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(body)});

}

async function load(manual){
  status(manual?'يجلب…':'يحدّث…');
  try{
    const [slots,rounds,dir,staff]=await Promise.all([
      sbGet(`slots?slot_date=eq.${DAY}&order=start_at&select=*`),
      sbGet(`game_rounds?order=played_at&select=id,slot_id,played_at,map,duration_sec,team_one,team_one_score,team_two,team_two_score,raw`),
      sbGet(`eva_directory?select=username,eva_user_id,email`).catch(()=>[]),
      sbGet(`gm_staff?select=*&order=name`).catch(()=>[]),
    ]);
    S.gmMissing=false;
    const gms=await sbGet(`gm_shifts?day=eq.${DAY}&select=*`).catch(()=>{S.gmMissing=true;return[]});
    S.extras=await sbGet(`extra_sales?day=eq.${DAY}&order=created_at&select=*`).catch(()=>[]);
    S.stock=await sbGet(`cafe_stock?select=item,qty`).catch(()=>[]);
    // فتحات الشبكة غير المحجوزة (0 لاعب) ليست حجوزات — تُخفى تماماً
    S.slots=(slots||[]).filter(s=>(s.booked_players||0)>0);
    S.rounds=rounds||[]; S.staff=staff||[]; S.gms=gms||[];
    S.dir=new Map((dir||[]).map(u=>[u.username,u.email]));
    compute(); loadedOnce=true; renderAll();
    status(`آخر تحديث ${fmtTS(Date.now())} · ${S.slots.length} حجز · ${S.dayRounds.length} جولة`);
  }catch(e){status('⚠ '+e.message)}
}

function breaksDuring(t0,t1){
  return S.gms.filter(g=>g.break_start&&g.break_end).filter(g=>{
    const bs=hmToTs(g.break_start),be=hmToTs(g.break_end);
    return bs!=null&&be!=null&&bs<t1&&t0<be;
  }).map(g=>g.name);
}

/* ═════════ نموذج التحليل ═════════ */
function compute(){
  const dayStart=new Date(DAY+'T03:00:00Z').getTime();
  const dayEnd  =dayStart+23*3600e3;
  S.dayRounds=S.rounds.filter(r=>{const t=+new Date(r.played_at);return t>=dayStart&&t<dayEnd})
    .map(r=>{
      const end=+new Date(r.played_at), dur=(r.duration_sec||0)*1000;
      const players=((r.raw&&r.raw.players)||[]).map(p=>({
        id:p.userId, name:(p.data&&p.data.niceName)||p.name||'ضيف', email:p.email||null,
        score:(p.data&&p.data.score)||0, kills:(p.data&&p.data.kills)||0,
        team:(p.data&&p.data.team!=null)?p.data.team:(p.team!=null?p.team:null),
        deaths:(p.data&&p.data.deaths)||0, assists:(p.data&&p.data.assists)||0, mvp:!!p.isMvp}));
      return {...r,end,start:end-dur,players,cc:String(r.id).startsWith('cc-')};
    }).sort((a,b)=>a.start-b.start);

  S.firstSeen=new Map();
  for(const r of S.rounds){
    const st=+new Date(r.played_at)-(r.duration_sec||0)*1000;
    for(const p of ((r.raw&&r.raw.players)||[])){
      if(p.userId!=null && !S.firstSeen.has(p.userId)) S.firstSeen.set(p.userId,st);
    }
  }

  const key=s=>s.eva_key_player||s.email||s.account_name||('#'+s.id);
  for(const s of S.slots){
    const st=+new Date(s.start_at);
    s._t=st; s._endT=st+BLOCK*60000; s._key=key(s);
    s._cancelled=s.state==='cancelled';
    s._rIds=new Set((s.roster||[]).map(p=>p.user_id).filter(v=>v!=null));
    s._games=[]; s._briefTarget=st-BRIEF_LEAD*60000;
  }
  const act=S.slots.filter(s=>!s._cancelled);

  /* الإسناد بجلسات الطاقم المتواصل (درس خالد/أيمن — «ساهل بالأسماء»):
     نفس الأسماء تلعب بلا انقطاع = نفس المجموعة مهما امتدّت. الجلسة تُرسى على
     الحجز الذي بدأت في نافذته، وتتوزّع جولاتها على بلوكات نفس العميل المتتالية،
     وما فاض بعد آخر بلوك له يبقى تجاوزاً عليه — لا يُنسب للعميل التالي الذي لم يحضر.
     تغيّر الأسماء (ولو بلا فجوة) = مجموعة جديدة = جلسة جديدة. */
  const sessions=[];
  for(const g of S.dayRounds){
    g._ids=g.players.map(p=>p.id).filter(v=>v!=null);
    const last=sessions[sessions.length-1];
    if(last){
      const gap=g.start-last.end;
      const ovC=(g._ids.length&&last.ids.size)?g._ids.some(id=>last.ids.has(id)):null;
      const join=gap<=EARLY*60000 ? (ovC!==false) : (gap<=15*60000&&ovC===true);
      if(join){last.games.push(g);last.end=Math.max(last.end,g.end);for(const id of g._ids)last.ids.add(id);continue}
    }
    sessions.push({start:g.start,end:g.end,games:[g],ids:new Set(g._ids)});
  }
  S.orphanSessions=[];
  for(const sess of sessions){
    /* صاحب الجلسة = الحجز الذي **يحتوي** وقت بدايتها؛ ولا نستعمل نافذة البدء المبكر
       إلا إن لم يحتوِها أيّ حجز (درس: جولة 21:33 داخل حجز 21:00 كانت تُنسب لـ21:40). */
    let anchor=act.find(s=>s._t<=sess.start&&sess.start<s._endT)
            || act.find(s=>sess.start<s._t&&s._t-sess.start<=EARLY*60000);
    if(!anchor){S.orphanSessions.push(sess);continue}
    const sameKey=act.filter(s=>s._key===anchor._key&&s._t>=anchor._t).sort((a,b)=>a._t-b._t);
    for(const g of sess.games){
      let tgt=anchor;
      for(const s of sameKey)if(s._t<=g.start)tgt=s;   // بلوك العميل الذي يحتوي بداية الجولة
      tgt._games.push(g);g._slot=tgt;
    }
    // القائمة معروفة ولا أحد من طاقم الجلسة فيها → تنبيه (لا يغيّر الإسناد)
    if(anchor._rIds.size&&sess.ids.size&&![...sess.ids].some(id=>anchor._rIds.has(id)))
      for(const g of sess.games)if(g._slot)g._slot._mismatch=true;
  }

  /* «حجز ثانٍ متّصل» (دبل) = نفس المجموعة واصلت في البلوك التالي.
     يُحدَّد بتطابق اللاعبين فعلياً؛ فحسابُ موظفٍ يحجز لعملاء مختلفين متتاليين
     ليس دبل (درس حجزَي صلاح ١٧:٤٠ و١٨:٢٠ — عميلان مختلفان). */
  for(const s of act){
    const prev=act.find(p=>p._endT===s._t);
    let second=false;
    if(prev){
      const a=new Set(s._games.flatMap(g=>g._ids||[])), b=new Set(prev._games.flatMap(g=>g._ids||[]));
      if(a.size&&b.size){
        let hit=0; for(const id of a)if(b.has(id))hit++;
        second=hit>=Math.max(1,Math.min(a.size,b.size)*0.5);      // نصف اللاعبين فأكثر
      } else second=(prev._key===s._key)&&!staffBooked(s);        // بلا بيانات لعب: الحساب، ما لم يكن موظفاً
    }
    s._second=second;
    s._entitled=second?BLOCK:BLOCK-SETUP;
  }
  for(const s of S.slots)if(s._cancelled){s._second=false;s._entitled=BLOCK-SETUP}

  let occupied=0;
  for(const s of S.slots){
    if(s._cancelled){s._rounds=0;continue}
    s._effStart=Math.max(s._t,occupied);
    s._delayedBy=Math.max(0,mins(s._effStart-s._t));
    const gs=s._games;
    s._rounds=gs.length;
    if(gs.length){
      const first=Math.min(...gs.map(g=>g.start)), last=Math.max(...gs.map(g=>g.end));
      s._firstStart=first; s._lastEnd=last;
      s._netSec=(last-first)/1000;
      s._playSec=gs.reduce((a,g)=>a+(g.duration_sec||0),0);
      s._gapSec=Math.max(0,s._netSec-s._playSec);
      s._net=mins(last-first);
      s._setupSec=Math.max(0,(first-s._effStart)/1000);
      s._setup=Math.max(0,mins(first-s._effStart)-(s._second?0:SETUP));
      s._deficit=Math.max(0,s._entitled-s._net);
      s._surplus=Math.max(0,s._net-s._entitled);
      s._over=Math.max(0,mins(last-s._endT));
      s._actual=Math.max(...gs.map(g=>g.players.length),0);
      occupied=Math.max(occupied,last);
      if(s._setup>0){
        // دخول الملعب أدقّ من البريفنق، والبريفنق أدقّ من الوصول
        if(s.entered_at) s._fault=(+new Date(s.entered_at)<=s._effStart)?'staff':'client';
        else if(s.briefed_at) s._fault=(+new Date(s.briefed_at)<=s._briefTarget)?'staff':'client';
        else if(s.arrived_at) s._fault=(+new Date(s.arrived_at)<=s._t-ARRIVE_LEAD*60000)?'staff':'client';
        s._breaks=breaksDuring(s._effStart,first);
      }
    }
    const roster=s.roster||[];
    s._newPlayers=roster.filter(p=>p.user_id==null||!S.firstSeen.has(p.user_id)||S.firstSeen.get(p.user_id)>=s._t).length;
    s._briefKnown=roster.length>0;
  }
  for(const s of act) s._delaysNext=!!(s._over&&act.some(n=>n._key!==s._key&&n._t>=s._endT&&s._lastEnd&&n._t<s._lastEnd));
  // حجز بلا لعب التهم وقتَه تجاوزُ السابق → غالباً لم يحضر
  for(const s of act) s._swallowed=!s._rounds&&s._effStart>=s._endT-5*60000;

  S.walkins=S.orphanSessions.map(sess=>({start:sess.start,end:sess.end,games:sess.games}));
  for(const w of S.walkins){
    w.net=mins(w.end-w.start);
    w.players=Math.max(...w.games.map(g=>g.players.length),0);
    w.overCancelled=S.slots.some(s=>s._cancelled&&w.games.some(g=>g.start>=s._t-EARLY*60000&&g.start<s._endT));
  }
}
/* الخطّ الزمني الموحّد: حجوزات + لعب بدون حجز في مكانه الزمني */
function timeline(){
  return [
    ...S.slots.map(s=>({t:s._t,slot:s})),
    ...S.walkins.map(w=>({t:w.start,walkin:w})),
  ].sort((a,b)=>a.t-b.t);
}

/* ═════════ عناصر مشتركة ═════════ */
/* الدفع يُدخله الموظف يدوياً بالكامل (قرار المؤسس) — حالة إيفا لا تُعرض ولا تُفترض */
function payChip(){return ''}
/* حجز باسم موظف = حجزه موظفٌ لصالح عميل → «اسأل العميل في البريفنق».
   مطابقة دقيقة بالكلمة كاملة (لا تُطابق «Mohamed» العامة — المقصود حساب mah تحديداً).
   لإضافة/حذف اسم: عدّل هذه القائمة فقط. */
const STAFF_NAMES=['salah','salahx','صلاح','mohannad','مهند','mah','mahk','marie','ميري'];
const STAFF_FULL=['salah saidam','marie dhean'];
function staffBooked(s){
  const acc=(s.account_name||'').trim().toLowerCase();
  if(STAFF_FULL.includes(acc))return true;
  const toks=(acc+' '+(s.eva_key_player||'').toLowerCase()).split(/[\s#·._-]+/).filter(Boolean);
  return toks.some(t=>STAFF_NAMES.includes(t));
}
function roundLine(g,withGame,fg){
  const col=fg||(g.cc?'#2b87e3':(g._slot?gameColor(g._slot.game):'var(--dim)'));
  const gname=withGame?(g.cc?'Color Chaos':(g._slot?shortGame(g._slot.game):'Arena')):'';
  const score=(g.team_one_score!=null&&g.team_two_score!=null)?`${g.team_one_score} - ${g.team_two_score}`:'—';
  const mut=fg?`style="color:${fg};opacity:.85"`:'class="dim"';
  return `<div class="round"><span class="dot" style="background:${col}"></span>
    <span class="t" ${fg?`style="color:${fg}"`:''}>${fmtT(g.start)}–${fmtT(g.end)}</span>
    <span ${fg?`style="color:${fg}"`:''}>${mmss(g.duration_sec||0)}</span>
    ${gname?`<span style="color:${col};font-weight:800">${gname}</span>`:''}
    <span ${mut}>${g.map||''}</span>
    <span ${mut}>النتيجة ${score}</span>
    <span ${mut}>${g.players.length}👤</span></div>`;
}
function briefChip(s,onColor){
  if(!s._briefKnown)return'';
  const cls=onColor?'wchip':'chip info';
  return s._newPlayers>0
    ?`<span class="${cls}">🎙 بريفنق مقترح · ${s._newPlayers} جديد</span>`
    :`<span class="${cls}" style="${onColor?'opacity:.8':''}">بلا بريفنق — سبق لعبوا</span>`;
}
/* اسم صاحب الحجز — أو أصحاب الحجوزات إن تعدّدوا في الفتحة نفسها */
function partiesLabel(s){
  const pt=partiesOf(s);
  if(pt.length<2)return s.account_name||'—';
  const est=pt.some(p=>p.estimated)&&!(s.pay_splits||[]).some(x=>x.name);
  return pt.map(p=>`${p.name} <b>${p.players}</b>`).join(' · ')+(est?' <span class="chip warn" title="لم تعطِ إيفا العدد — وزّعناه بالتساوي، صحّحه من «÷ تقسيم»">أعداد تقديرية</span>':'');
}
function slotPlayers(s){
  const m=new Map();
  for(const g of s._games)for(const p of g.players){
    const k=p.id!=null?('u'+p.id):('n'+p.name);
    const e=m.get(k)||{name:p.name,score:0,k:0,d:0,a:0,mvp:false};
    e.score+=p.score;e.k+=p.kills;e.d+=p.deaths;e.a+=p.assists;e.mvp=e.mvp||p.mvp;
    m.set(k,e);
  }
  return[...m.values()].sort((a,b)=>b.score-a.score);
}

/* ═════════ التشغيل ═════════ */
function fieldStatus(){
  const now=Date.now();
  if(DAY!==opDay())return{cls:'',txt:'يوم سابق — راجع «التفاصيل»'};
  const act=S.slots.filter(s=>!s._cancelled);
  const cur=act.find(s=>s._t<=now&&now<s._endT);
  const lastG=[...S.dayRounds].sort((a,b)=>b.end-a.end)[0];
  if(cur){
    if(cur._rounds){
      const gap=mins(now-cur._lastEnd);
      return gap<=2?{cls:'ok',txt:`🎮 يلعب الآن — ${shortGame(cur.game)} · ${cur._rounds} جولة حتى الآن`}
                   :{cls:'ok',txt:`⏸ داخل الملعب (بين الخرائط) — آخر جولة انتهت ${fmtT(cur._lastEnd)}`};
    }
    const sinceStart=mins(now-cur._t);
    return sinceStart<=(cur._second?0:SETUP)
      ?{cls:'',txt:`🛠 تجهيز — حجز ${fmtT(cur._t)} (${shortGame(cur.game)})`}
      :{cls:'warn',txt:`⏳ لم يُرصد بدء اللعب بعد — حجز ${fmtT(cur._t)} متأخّر ${sinceStart-(cur._second?0:SETUP)}د عن المسموح`};
  }
  if(lastG&&mins(now-lastG.end)<=3&&!lastG._slot)return{cls:'warn',txt:'🎮 لعب جارٍ بدون حجز!'};
  const next=act.find(s=>s._t>now);
  return next?{cls:'',txt:`الملعب فاضٍ — القادم ${fmtT(next._t)} (${shortGame(next.game)}) بعد ${mins(next._t-now)}د`}
             :{cls:'',txt:'الملعب فاضٍ — لا حجوزات قادمة اليوم'};
}
function gmNowLine(){
  if(!S.gms.length)return'';
  const now=Date.now();
  const onBreak=S.gms.filter(g=>{const a=hmToTs(g.break_start),b=hmToTs(g.break_end);return a!=null&&b!=null&&a<=now&&now<b}).map(g=>g.name);
  const inside=S.gms.map(g=>g.name).filter(n=>!onBreak.includes(n));
  return `<div class="sm dim" style="margin-top:7px">👥 داخل الملعب: <b style="color:var(--ink)">${inside.join('، ')||'—'}</b>${onBreak.length?` · ☕ بريك: <b style="color:var(--amber)">${onBreak.join('، ')}</b>`:''}</div>`;
}
function renderOps(){
  const el=document.getElementById('tab-ops'); if(!el)return;
  const act=S.slots.filter(s=>!s._cancelled);
  if(!act.length&&!S.dayRounds.length){el.innerHTML='<div class="empty">لا حجوزات ولا لعب مرصود في هذا اليوم</div>';return}
  const now=Date.now(), live=DAY===opDay();
  const cur=act.find(s=>s._t<=now&&now<s._endT);
  const next=act.find(s=>s._t>now);
  const fs2=fieldStatus();
  const onBreak=S.gms.filter(g=>{const a=hmToTs(g.break_start),b=hmToTs(g.break_end);return a!=null&&b!=null&&a<=now&&now<b}).map(g=>g.name);
  const inside=S.gms.map(g=>g.name).filter(n=>onBreak.indexOf(n)<0);
  const played=act.filter(s=>s._rounds);
  const alerts=[];
  for(const s of act){
    if(s._deficit>=5)alerts.push({t:s._t,k:'bad',x:fmtT(s._t)+' — نقص '+s._deficit+'د'});
    if(s._setup>5)alerts.push({t:s._t,k:'warn',x:fmtT(s._t)+' — تجهيز زائد '+s._setup+'د'+(s._fault==='staff'?' (تشغيلي)':s._fault==='client'?' (العميل)':'')});
    if(s._delaysNext)alerts.push({t:s._t,k:'bad',x:fmtT(s._t)+' — تجاوز '+s._over+'د وأخّر الحجز التالي'});
    if(s._swallowed&&now>s._endT)alerts.push({t:s._t,k:'bad',x:fmtT(s._t)+' — لم يحضر'});
  }
  for(const w of S.walkins)alerts.push({t:w.start,k:'warn',x:fmtT(w.start)+' — لعب بدون حجز ('+w.players+' لاعب · '+w.net+'د)'});
  const unsent=played.filter(s=>hasRecording(s)&&!s.sent_at&&s.rec_status!=='declined').length;
  if(unsent)alerts.push({t:now,k:'warn',x:unsent+' تسجيل لم يُرسَل'});
  alerts.sort((a,b)=>a.t-b.t);

  /* شريط اليوم: كل حجز خانة ملوّنة بحالته */
  const strip=timeline().map(it=>{
    if(it.walkin){const w=it.walkin;
      return '<div class="tick walkin" title="لعب بدون حجز '+fmtT(w.start)+'"><span>'+fmtT(w.start)+'</span><b>بدون حجز</b></div>';}
    const s=it.slot;
    let cls='idle',lbl='—';
    if(s._cancelled){cls='cx';lbl='أُلغي';}
    else if(s._rounds){cls=s._deficit?'short':'good';lbl=s._deficit?('−'+s._deficit+'د'):(s._net+'د');}
    else if(s._swallowed&&now>s._endT){cls='noshow';lbl='لم يحضر';}
    else if(s._t<=now&&now<s._endT){cls='now';lbl='الآن';}
    else if(now>=s._endT){cls='noplay';lbl='بلا لعب';}
    else {cls='soon';lbl='بعد '+mins(s._t-now)+'د';}
    return '<div class="tick '+cls+'" style="--gc:'+gameColor(s.game)+'" title="'+shortGame(s.game)+' · '+(s.account_name||'')+'" onclick="goAna(\''+s.id+'\')">'
      +'<span>'+fmtT(s._t)+'</span><b>'+lbl+'</b></div>';
  }).join('');

  let h='<div class="opsgrid">'
   +'<div class="opsnow '+(fs2.cls||'')+'">'
     +'<div class="opslbl">حالة الملعب</div>'
     +'<div class="opsbig">'+fs2.txt+'</div>'
     +(cur&&cur._rounds?'<div class="opssub">آخر جولة '+fmtT(cur._lastEnd)+' · '+cur._rounds+' جولة · '+mmss(cur._netSec)+' صافي لعب</div>':'')
     +(cur?'<div class="opssub">🧑 '+partiesLabel(cur)+' · '+(cur._actual||cur.actual_players||cur.booked_players)+' لاعب</div>':'')
   +'</div>'
   +'<div class="opscard">'
     +'<div class="opslbl">القادم</div>'
     +(next?('<div class="opsbig2"><span class="t">'+fmtT(next._t)+'</span> '+shortGame(next.game)+'</div>'
        +'<div class="opssub">'+partiesLabel(next)+' · '+next.booked_players+' لاعب</div>'
        +'<div class="opssub" style="margin-top:6px">'+(next._second
            ? '<span class="chip ok">لا يحتاج بريفنق (دبل)</span>'
            : '<span class="chip info">🎙 البريفنق قبل '+fmtT(next._briefTarget)+'</span>')
        +' <span class="chip">بعد '+mins(next._t-now)+'د</span></div>')
      :'<div class="opsbig2 dim">لا حجوزات قادمة</div>')
   +'</div>'
   +'<div class="opscard">'
     +'<div class="opslbl">الطاقم داخل الملعب</div>'
     +'<div class="opsbig2">'+(live?(inside.join('، ')||'<span class="dim">لم يُسجَّل</span>'):'—')+'</div>'
     +(onBreak.length&&live?'<div class="opssub" style="color:var(--amber)">☕ بريك: '+onBreak.join('، ')+'</div>':'')
   +'</div>'
   +'<div class="opscard">'
     +'<div class="opslbl">حصيلة اليوم</div>'
     +'<div class="opsstats">'
       +'<div><b>'+act.length+'</b><span>حجز</span></div>'
       +'<div><b>'+played.length+'</b><span>لُعب</span></div>'
       +'<div><b class="'+(played.reduce((a,s)=>a+s._deficit,0)?'bad':'ok')+'">'+played.reduce((a,s)=>a+s._deficit,0)+'د</b><span>نقص</span></div>'
       +'<div><b>'+played.reduce((a,s)=>a+s._rounds,0)+'</b><span>جولة</span></div>'
     +'</div>'
   +'</div>'
  +'</div>'
  +'<h2>شريط اليوم</h2><div class="strip">'+strip+'</div>'
  +'<h2>ما يحتاج انتباهك ('+alerts.length+')</h2>'
  +(alerts.length?'<div class="alerts">'+alerts.map(a=>'<div class="alert '+a.k+'">'+a.x+'</div>').join('')+'</div>'
                 :'<div class="empty">لا ملاحظات — اليوم يسير سليماً ✓</div>');
  el.innerHTML=h;
}

/* ═════════ الاستقبال ═════════ */

let RCP_OPEN=new Set();
function toggleRcp(id){RCP_OPEN.has(id)?RCP_OPEN.delete(id):RCP_OPEN.add(id);renderRcp();sweep(document.getElementById('tab-rcp'))}

/* بطاقة الاستقبال الكاملة (أختام + عدد + سؤال المصدر) */
function rcpCard(s,featured){
  const now=Date.now(), col=gameColor(s.game);
  const cur=s._t<=now&&now<s._endT, past=now>=s._endT;

  const arr=s.arrived_at, brf=s.briefed_at, ent=s.entered_at, cnt=s.actual_players;
  const cntBox=(()=>{
    const started=now>=s._t;
    const src=cnt!=null?'مؤكَّد':(s._actual?'من إيفا':(started?'مفترض':''));

      +(short?'<span class="chip warn">ناقص '+(s.booked_players-eff)+'</span>'
             :(eff!=null?'<span class="chip ok">مكتمل'+(src?' · '+src:'')+'</span>':''));
  })();
  return '<div class="card '+(featured?'rcpnext':'')+'" style="border-inline-start-color:'+col+';background:'+(featured?'color-mix(in srgb, '+col+' 18%, #10161d)':(cur?'color-mix(in srgb, '+col+' 14%, #10161d)':'var(--card)'))+'">'
    +'<div class="row" style="cursor:pointer" onclick="toggleRcp(\''+s.id+'\')">'
      +(featured?'<span class="chip info">القادم</span>':'<span class="chev" style="opacity:.6;transform:rotate(180deg)">⌄</span>')
      +'<span class="t" style="font-size:18px">'+fmtT(s._t)+'</span>'
      +'<span style="color:'+col+';font-weight:800">'+shortGame(s.game)+'</span>'
      +'<span class="dim">🧑 '+partiesLabel(s)+' · '+s.booked_players+'👤</span>'
      +'<span class="grow"></span>'
      +(cur?'<span class="chip info">جارٍ</span>':past?'<span class="chip">انتهى</span>':'<span class="chip">بعد '+mins(s._t-now)+'د</span>')
    +'</div>'
    +'<div class="row sm" style="margin-top:6px">'
      +(s._second?'<span class="chip ok">✋ لا يحتاج بريفنق — حجز ثانٍ متّصل (ولا تجهيز)</span>'
        :(s._briefKnown&&s._newPlayers===0?'<span class="chip ok">✋ لا يحتاج بريفنق — كلّهم سبق لعبوا</span>'
          :'<span class="chip info">🎙 يحتاج بريفنق'+(s._newPlayers?' · '+s._newPlayers+' جديد':'')+' — أدخلهم قبل <b class="t">'+fmtT(s._briefTarget)+'</b></span>'))
      +(staffBooked(s)?'<span class="chip bad">👤 حجز موظف — اسأل العميل عن اسمه وبياناته</span>':'')
    +'</div>'
    +'<div class="row" style="margin-top:8px">'
      +(arr?'<span class="chip ok">وصل '+fmtT(arr)+' <span class="x" onclick="rcpClear(\''+s.id+'\',\'arrived_at\')">✕</span></span>'
           :'<button class="btn primary" onclick="rcpStamp(\''+s.id+'\',\'arrived_at\')">وصل ✓</button>')
      +(s._second?'':(brf
        ?'<span class="chip '+(briefLate?'warn':'ok')+'">دخل البريفنق '+fmtT(brf)+(briefLate?' — متأخر '+mins(new Date(brf)-s._briefTarget)+'د':'')+' <span class="x" onclick="rcpClear(\''+s.id+'\',\'briefed_at\')">✕</span></span>'
        :'<button class="btn" onclick="rcpStamp(\''+s.id+'\',\'briefed_at\')">→ دخل البريفنق</button>'))
      +(ent?'<span class="chip ok">دخل الملعب '+fmtT(ent)+' <span class="x" onclick="rcpClear(\''+s.id+'\',\'entered_at\')">✕</span></span>'

    +'</div></div>';
}

    +'<span style="color:'+col+';font-weight:800">'+shortGame(s.game)+'</span>'
    +'<span class="dim sm">🧑 '+partiesLabel(s)+' · '+(cnt??s._actual??s.booked_players)+'/'+s.booked_players+'👤</span>'
    +'<span class="grow"></span>'
    +(arr?'<span class="chip ok sm">وصل '+fmtT(arr)+'</span>':'')
    +(brf?'<span class="chip '+(briefLate?'warn':'ok')+' sm">بريفنق '+fmtT(brf)+'</span>'

function renderRcp(){
  const el=document.getElementById('tab-rcp');
  const act=S.slots.filter(s=>!s._cancelled);
  if(!act.length){el.innerHTML='<div class="empty">لا حجوزات في هذا اليوم</div>';return}
  const now=Date.now();
  const fs2=fieldStatus();
  /* الحجز المعروض في الأعلى: الجاري إن كان بلا أختام، وإلا القادم */
  const cur=act.find(s=>s._t<=now&&now<s._endT);
  const upcoming=act.find(s=>s._t>now);
  const featured=(cur&&!(cur.arrived_at&&(cur.briefed_at||cur.entered_at)))?cur:(upcoming||cur);
  let h='<div class="hero">'
    +'<div class="big" style="color:'+(fs2.cls==='ok'?'var(--green)':fs2.cls==='warn'?'var(--amber)':'var(--ink)')+'">'+fs2.txt+'</div>'
    +(DAY===opDay()?gmNowLine():'')
    +'</div>';
  if(featured)h+=rcpCard(featured,true);
  h+='<div class="row" style="margin:12px 0 8px">'
     +'<h2 style="margin:0">بقيّة حجوزات اليوم</h2><span class="grow"></span>'
     +'<button class="btn" onclick="rcpAll(false)">اطوِ الكل</button>'
     +'<button class="btn" onclick="rcpAll(true)">افتح الكل</button>'
     +'<span class="dim sm">اضغط أي سطر لفتحه</span></div>';
  h+=act.filter(s=>!featured||s.id!==featured.id)
       .map(s=>RCP_OPEN.has(s.id)?rcpCard(s,false):rcpFold(s)).join('');
  el.innerHTML=h;
  sweep(el);
}
async function rcpStamp(id,field){
  try{await sbPatch('slots',id,{[field]:new Date().toISOString()});const s=S.slots.find(x=>x.id===id);if(s)s[field]=new Date().toISOString();compute();renderAll();status('✓ سُجّل')}
  catch(e){status('⚠ '+e.message)}
}
async function rcpClear(id,field){
  try{await sbPatch('slots',id,{[field]:null});const s=S.slots.find(x=>x.id===id);if(s)s[field]=null;compute();renderAll();status('✓ أُلغي الختم')}
  catch(e){status('⚠ '+e.message)}
}
async function rcpHeard(id,v){
  try{await sbPatch('slots',id,{heard_from:v||null});const s=S.slots.find(x=>x.id===id);if(s)s.heard_from=v||null;renderAll();status('✓ حُفظ مصدر المعرفة')}
  catch(e){status(/heard_from|column/.test(e.message)?'⚠ شغّل ملف eva_v4.sql في Supabase أولاً':'⚠ '+e.message)}
}
async function rcpCount(id,v){
  const n=v===''?null:Math.max(0,+v);
  try{await sbPatch('slots',id,{actual_players:n});const s=S.slots.find(x=>x.id===id);if(s)s.actual_players=n;compute();renderAll();status('✓ حُفظ العدد')}
  catch(e){status('⚠ '+e.message)}
}

/* ═════════ التفاصيل ═════════ */
function playBar(s){
  const end=Math.max(s._endT,s._lastEnd||0);
  const span=end-s._t||1;
  const pct=x=>Math.max(0,Math.min(100,(x-s._t)/span*100));
  return `<div class="bar">
      <div class="seg setup" style="inset-inline-start:0;width:${pct(s._firstStart)}%"></div>
      <div class="seg play" style="inset-inline-start:${pct(s._firstStart)}%;width:${Math.max(1,pct(s._lastEnd)-pct(s._firstStart))}%"></div>
      ${s._lastEnd>s._endT?`<div class="mark" style="inset-inline-start:${pct(s._endT)}%"></div>`:''}
    </div>
    <div class="barlbl"><span>الحجز ${fmtT(s._t)}</span><span>بدء اللعب ${fmtT(s._firstStart)}</span><span>النهاية ${fmtT(s._lastEnd)}</span><span>نهاية الحجز ${fmtT(s._endT)}</span></div>`;
}
/* رحلة العميل: وصل → البريفنق/دخل الملعب → بدء اللعب (مع الفروق) */
function journeyLine(s){
  const step=(lbl,t,fb)=>`<span class="jst ${t?'on':''}"><b>${lbl}</b> ${t?fmtT(t):(fb||'--')}</span>`;
  const arrow='<span class="jar">→</span>';
  const parts=[step('وصل',s.arrived_at)];
  // خطوة واحدة: البريفنق أو دخول الملعب — أيّهما سُجّل، بوقته
  if(s.briefed_at)      parts.push(step('دخل البريفنق',s.briefed_at));
  else if(s.entered_at) parts.push(step('دخل الملعب',s.entered_at));
  else                  parts.push(step(s._second?'دخل الملعب':'دخل البريفنق/الملعب',null));
  parts.push(step('بدأ اللعب',s._firstStart,s._rounds?'':'لم يبدأ'));
  return `<div class="journey">${parts.join(arrow)}</div>`;
}
function faultChip(s){
  if(s._fault==='client')return'<span class="chip warn">سبب التأخير: العميل (تأخّر في الوصول/البريفنق/دخول الملعب)</span>';
  if(s._fault==='staff')return'<span class="chip bad">سبب التأخير: تشغيلي — العميل كان جاهزاً في وقته</span>';
  return'<span class="chip">سبب التأخير غير معروف (لا أختام استقبال)</span>';
}
function renderAna(){
  const el=document.getElementById('tab-ana');
  const played=S.slots.filter(s=>s._rounds);
  const totDef=played.reduce((a,s)=>a+s._deficit,0);
  const wMin=S.walkins.reduce((a,w)=>a+w.net,0);
  let h=`<div class="hero"><div class="big" style="color:${totDef?'var(--amber)':'var(--green)'}">${totDef?`إجمالي النقص اليوم: ${totDef} دقيقة`:'لا نقص مرصود اليوم ✓'}</div>
    <div class="dim sm">${played.length} جلسة ملعوبة من ${S.slots.filter(s=>!s._cancelled).length} حجز${wMin?` · لعب بدون حجز ${wMin}د`:''} — الأرقام من إيفا مباشرة، لا يملك أحد تغييرها</div></div>`;

  if(!S.slots.length&&!S.walkins.length){el.innerHTML=h+'<div class="empty">لا بيانات</div>';return}

  h+=timeline().map(item=>{
    if(item.walkin)return walkinCard(item.walkin,true);
    const s=item.slot;
    const col=gameColor(s.game);
    if(s._cancelled)return `<div class="evablock" id="ana-${s.id}" style="background:#4a5866">
      <div class="row"><span class="t" style="font-size:16px">${fmtT(s._t)}–${fmtT(s._endT)}</span>
        <span style="text-decoration:line-through;font-weight:800">${shortGame(s.game)}</span>
        ${s.account_name?`<span class="dim">🧑 ${s.account_name}</span>`:''}
        <span class="grow"></span><span class="wchip alarm">أُلغي من إيفا — خارج الحسابات</span></div></div>`;
    const emails=s.email?` · <span style="direction:ltr;unicode-bidi:isolate">${s.email}</span>`:'';
    let body;
    if(s._rounds){
      const players=slotPlayers(s);
      const maps=[...new Set(s._games.map(g=>g.map).filter(Boolean))];
      const notes=[
        s.arrived_at?'':'',
        s._setup>0?faultChip(s):'',

        s._delayedBy?`<span class="chip bad">⏳ تأخير في بدء الحجز ${s._delayedBy}د — الحجز السابق تجاوز وقته</span>`:'',
        s._mismatch?'<span class="chip warn">⚠ أُسند بالوقت — اللاعبون لا يطابقون قائمة الحجز</span>':'',
        s._surplus?`<span class="chip ok">لعب زيادة +${s._surplus}د</span>`:'',
        s._over?`<span class="chip ${s._delaysNext?'bad':'warn'}">تجاوز وقت الحجز ${s._over}د${s._delaysNext?' — أخّر الحجز التالي!':''}</span>`:'',

        staffBooked(s)?'<span class="chip">👤 حجز موظف</span>':'',
        s._second?'<span class="chip">دبل — مستحق ٤٠د بلا تجهيز</span>':''
      ].filter(Boolean).join('');
      body=`<div class="dcols">
        <div class="dcol">
          <div class="secttl">⏱ الزمن</div>
          ${playBar(s)}
          <div class="metrics">
            <div class="metric hl"><div class="v">${mmss(s._netSec)}</div><div class="l">صافي اللعب</div>
              <div class="s">داخل الخرائط ${mmss(s._playSec)} · توقف ${mmss(s._gapSec)}</div></div>
            <div class="metric"><div class="v" style="color:${s._setup?'var(--amber)':'var(--ink)'}">${mmss(s._setupSec)}</div><div class="l">التجهيز</div>
              <div class="s">المسموح ${s._second?0:SETUP}د${s._setup?` · زائد ${s._setup}د`:''}</div></div>
            <div class="metric"><div class="v" style="color:${s._deficit?'var(--red)':'var(--green)'}">${s._deficit?'−'+s._deficit+'د':'✓'}</div><div class="l">${s._deficit?'نقص':'سليم'}</div>
              <div class="s">المستحق ${s._entitled}د</div></div>
            <div class="metric"><div class="v">${s._actual} / ${s.booked_players}</div><div class="l">لعب/محجوز</div>
              ${s.actual_players!=null?`<div class="s">الاستقبال: ${s.actual_players}</div>`:''}</div>
          </div>

          ${journeyLine(s)}

          </div>
          ${players.length?`<div class="secttl" style="margin-top:12px">🏅 النقاط — ${players.length} لاعب</div>
          <div class="pgrid">${players.map(p=>`<div class="prow"><span class="grow">${p.name}${p.mvp?' <span class="mvp">MVP</span>':''}</span>
            <span class="kda">${p.k}/${p.d}/${p.a}</span><span class="score">${p.score.toLocaleString('en')}</span></div>`).join('')}</div>`:''}
        </div>

    }else{
      const past=Date.now()>s._endT&&DAY<=opDay();
      body=`<div class="${s._swallowed&&past?'sm':'dim sm'}" style="${s._swallowed&&past?'color:var(--red);font-weight:700':''}">${s._swallowed&&past?'⚠ وقت هذا الحجز استهلكه تجاوز الحجز السابق (نفس المجموعة واصلت اللعب) — العميل لم يحضر على الأرجح':(past?'لم يُرصد أي لعب لهذا الحجز (تأكد من تشغيل المزامنة)':'لم يبدأ بعد')}</div>
      ${journeyLine(s)}
      ${s._delayedBy?`<div class="row sm" style="margin-top:5px"><span class="chip bad">⏳ تأخير في بدء الحجز ${s._delayedBy}د — الملعب مشغول بالحجز السابق</span></div>`:''}`;
    }
    const open=ANA_OPEN.has(s.id);
    return `<div class="dwrap ${open?'open':''}" id="ana-${s.id}" style="--gc:${col}">
      <div class="dstrip" style="--gc:${col}" onclick="toggleAna('${s.id}')">

        <span class="t">${fmtT(s._t)}–${fmtT(s._endT)}</span>
        <span style="font-weight:800;letter-spacing:.3px">${gameName(s.game)}</span>
        <span style="opacity:.92;font-size:12.5px">🧑 ${partiesLabel(s)}</span>
        <span class="grow"></span>
        ${s._rounds?`<span class="wchip">صافي اللعب <b>${mmss(s._netSec)}</b></span>
          <span class="wchip">التجهيز <b>${s._setupSec?mmss(s._setupSec):'—'}</b>${s._setup?` <span style="color:#ffd9a0">(زائد ${s._setup}د)</span>`:''}</span>

        ${s._second?'<span class="wchip">دبل</span>':''}
        ${staffBooked(s)?'<span class="wchip">👤 موظف</span>':''}
        ${s._rounds?(s._deficit?`<span class="wchip alarm">نقص ${s._deficit}د</span>`:'<span class="wchip solid" style="color:var(--green)">سليم</span>')
          :(s._swallowed?'<span class="wchip alarm">لم يحضر</span>':'<span class="wchip">لم يُرصد لعب</span>')}

      ${open?`<div class="dbody">${emails?`<div class="dim sm" style="margin-bottom:6px">${emails.replace(/^ · /,'')}</div>`:''}${body}</div>`:''}</div>`;
  }).join('');
  el.innerHTML=`<div class="anabar">
      <button class="btn" onclick="anaAll(false)">اطوِ الكل</button>
      <button class="btn" onclick="anaAll(true)">افتح الكل</button>
      <button class="btn" onclick="anaProblems()">المشاكل فقط</button>
      <span class="dim sm">اضغط على رأس أي حجز لطيّه أو فتحه</span>
    </div><div class="anagrid">`+h+`</div>`;
  sweep(el);
}
/* بطاقات التفاصيل: مفتوحة افتراضياً، والرأس يلخّص — والضغط عليه يطويها عند الحاجة */
let ANA_OPEN=new Set(), ANA_INIT=false;
function toggleAna(id){ANA_OPEN.has(id)?ANA_OPEN.delete(id):ANA_OPEN.add(id);renderAna();sweep(document.getElementById('tab-ana'))}
function anaAll(on){ANA_OPEN=on?new Set(S.slots.map(s=>s.id)):new Set();renderAna();sweep(document.getElementById('tab-ana'))}
function anaProblems(){
  ANA_OPEN=new Set(S.slots.filter(s=>!s._cancelled&&(s._deficit||s._setup||s._delayedBy||s._swallowed||s._over)).map(s=>s.id));
  renderAna();sweep(document.getElementById('tab-ana'));status(`فُتحت ${ANA_OPEN.size} بطاقة فيها ملاحظات`);
}
function goAna(id){switchTab('ana');ANA_OPEN.add(id);renderAna();sweep(document.getElementById('tab-ana'));const c=document.getElementById('ana-'+id);if(c){c.scrollIntoView({behavior:'smooth',block:'center'});c.classList.add('flash');setTimeout(()=>c.classList.remove('flash'),3500)}}

/* ═════════ المبيعات ═════════ */
function discCode(s){return s.discount_code??''}
function discAmountFor(s,amt){
  const d=DISCOUNTS.find(x=>x.code===discCode(s));
  if(d&&d.pct!=null&&d.code!=='')return +(amt*d.pct/100).toFixed(2);
  return +(s.discount||0);
}
/* ── حساب الجلسة مع تقسيم الدفع ──
   splits = [{n,pay,code}] لأشخاصٍ يدفعون بطريقة/خصم مختلف؛ الباقون على الطريقة والخصم الأساسيين. */
/* أطراف الحجز: تصحيح الموظف اليدوي (pay_splits) يتقدّم على تقدير إيفا */
function partiesOf(s){
  const sp=Array.isArray(s.pay_splits)?s.pay_splits.filter(x=>+x.n>0&&x.name):[];
  if(sp.length)return sp.map(x=>({name:x.name,players:+x.n}));
  return Array.isArray(s.parties)?s.parties.filter(p=>+p.players>0):[];
}
function saleCalc(s){
  const rate=rateFor(s.start_at,DAY);
  const total=s.actual_players??s._actual??s.booked_players??0;
  const splits=Array.isArray(s.pay_splits)?s.pay_splits.filter(x=>+x.n>0):[];
  const used=splits.reduce((a,x)=>a+(+x.n||0),0);
  const restN=Math.max(0,total-used);
  const parts=[];
  const lineOf=(n,pay,code,manual,name)=>{
    const amt=+(n*rate).toFixed(2);
    const d=DISCOUNTS.find(x=>x.code===(code||''));
    let disc=(d&&d.pct!=null&&d.code)?+(amt*d.pct/100).toFixed(2):(+manual||0);
    if(isFreePay(pay))disc=amt;                     // سوبر نوفا: مجاني بالكامل
    return {n,pay:pay||'',code:code||'',name:name||'',amt,disc:+disc.toFixed(2),net:+Math.max(0,amt-disc).toFixed(2)};
  };
  const pt=Array.isArray(s.parties)?s.parties.filter(p=>+p.players>0):[];
  if(!splits.length&&pt.length>1){
    /* عدة حجوزات في الفتحة نفسها (٩ صلاح + ١ بدر) — سطر لكل صاحب حجز */
    const sum=pt.reduce((a,p)=>a+(+p.players||0),0);
    for(const p of pt){
      const n=sum&&sum!==total?Math.round((+p.players)*total/sum):(+p.players);
      if(n>0)parts.push(lineOf(n,s.pay_method||'',discCode(s),s.discount,p.name));
    }
  }else{
    if(restN>0||!splits.length)parts.push(lineOf(restN,s.pay_method||'',discCode(s),s.discount,pt.length===1?pt[0].name:''));
    for(const x of splits)parts.push(lineOf(+x.n,x.pay,x.code,x.amount,x.name));
  }
  return {rate,total,restN,splits,parts,multi:parts.length>1,
    amt:+parts.reduce((a,p)=>a+p.amt,0).toFixed(2),
    disc:+parts.reduce((a,p)=>a+p.disc,0).toFixed(2),
    net:+parts.reduce((a,p)=>a+p.net,0).toFixed(2)};
}
function renderSales(){
  const el=document.getElementById('tab-sales');
  if(!S.slots.length&&!S.walkins.length){el.innerHTML='<div class="empty">لا حجوزات في هذا اليوم</div>';return}
  const payT=new Map(PAYMENTS.map(p=>[p,0])), payN=new Map(PAYMENTS.map(p=>[p,0]));
  let gross=0,discT=0,unpaid=0,idx=0,cards='';
  for(const item of timeline()){
    if(item.walkin){
      const w=item.walkin, rate=rateFor(new Date(w.start).toISOString(),DAY), amt=w.players*rate;
      cards+='<div class="inv walk"><div class="invh"><span class="t">'+fmtT(w.start)+'</span>'
        +'<b style="color:var(--amber)">لعب بدون حجز</b>'
        +'<span class="dim sm">'+w.players+' لاعب × '+rate.toFixed(2)+'</span>'
        +'<span class="grow"></span><span class="amt">'+amt.toFixed(2)+'</span></div>'
        +'<div class="invb dim sm">تقديري من رصد إيفا — راجعه مع الكاشير، لا يدخل المجاميع</div></div>';
      continue;
    }
    const s=item.slot;
    if(s._cancelled||(s._swallowed&&Date.now()>s._endT&&!s.pay_method)){
      cards+='<div class="inv void"><div class="invh"><span class="t">'+fmtT(s._t)+'</span>'
        +'<b style="text-decoration:line-through">'+shortGame(s.game)+'</b>'
        +'<span class="dim sm">'+(s.account_name||'')+'</span><span class="grow"></span>'
        +'<span class="chip bad">'+(s._cancelled?'أُلغي من إيفا':'لم يحضر')+' — لا يُحصَّل</span></div></div>';
      continue;
    }
    idx++;
    const c=saleCalc(s);
    gross+=c.amt; discT+=c.disc;
    const parts=c.parts.filter(p=>p.n>0);
    for(const p of parts){
      if(p.pay&&payT.has(p.pay)){payT.set(p.pay,payT.get(p.pay)+p.net);payN.set(p.pay,payN.get(p.pay)+p.n)}
      else if(!p.pay)unpaid+=p.net;
    }
    const due=parts.some(p=>!p.pay);
    const linesHtml=parts.map(p=>{
      const d=DISCOUNTS.find(x=>x.code===p.code);
      return '<div class="lin"><span class="qty">'+p.n+'</span><span class="dim">×</span><span>'+c.rate.toFixed(2)+'</span>'
        +(p.name?'<b>'+p.name+'</b>':'<span class="dim">لاعبون</span>')
        +(d&&d.code?'<span class="chip warn sm">'+d.label+'</span>':'')
        +'<span class="grow"></span>'
        +(p.disc?'<span class="dim sm">−'+p.disc.toFixed(2)+'</span>':'')
        +'<span class="lnet">'+p.net.toFixed(2)+'</span>'
        +'<span class="pay '+(p.pay?'set':'unset')+'">'+(p.pay||'بلا دفع')+'</span></div>';
    }).join('');
    const tools=c.multi
      ? '<span class="chip info">مقسّم على '+parts.length+'</span>'
      : '<select class="disc-sel" onchange="setSaleField(\''+s.id+'\',\'pay_method\',this.value)">'
        +'<option value="">— طريقة الدفع —</option>'
        +PAYMENTS.map(p=>'<option '+((s.pay_method||'')===p?'selected':'')+'>'+p+'</option>').join('')
        +'</select>'
        +'<select class="disc-sel" onchange="setDiscCode(\''+s.id+'\',this.value)">'
        +DISCOUNTS.map(d=>'<option value="'+d.code+'" '+(discCode(s)===d.code?'selected':'')+'>'+d.label+'</option>').join('')
        +'</select>';
    cards+='<div class="inv '+(due?'due':'paidok')+'" style="--gc:'+gameColor(s.game)+'">'
      +'<div class="invh"><span class="num">#'+idx+'</span><span class="t">'+fmtT(s._t)+'</span>'
      +'<span class="gtag" style="background:'+gameColor(s.game)+'">'+shortGame(s.game)+'</span>'
      +'<span class="who">'+partiesLabel(s)+'</span><span class="grow"></span>'
      +'<span class="ord">'+(s.order_no?'طلب #'+s.order_no:'<span class="dim">بلا رقم طلب</span>')+'</span>'
      +((!c.multi&&isVoidPay(s.pay_method))?'<span class="chip warn" style="font-weight:800">'+s.pay_method+'</span>':'<span class="amt">'+c.net.toFixed(2)+'</span>')+'</div>'
      +'<div class="invb"><div class="lines">'+linesHtml+'</div>'
      +'<div class="invtools">'+tools
      +'<button class="btn" onclick="splitOpen(\''+s.id+'\')">÷ تقسيم</button>'
      +'<button class="btn" onclick="voidBooking(\''+s.id+'\')" style="'+(isVoidPay(s.pay_method)?'background:var(--red);color:#fff;border-color:var(--red)':'')+'">🚫 لم يلعب هنا</button>'
      +'<button class="noteb '+(s.sale_note?'has':'')+'" onclick="noteEdit(\''+s.id+'\')">'+(s.sale_note||'📝 ملاحظة')+'</button>'
      +'<span class="grow"></span><span class="dim sm">الإجمالي '+c.amt.toFixed(2)+(c.disc?' · خصم −'+c.disc.toFixed(2):'')+'</span>'
      +'</div></div></div>';
  }
  // 🌙 إيفا نايت / إيفنت — مبيعات تُضاف للجلسات (مفصولة عن الكافيه)
  const nightItems=(S.extras||[]).filter(isSaleExtra);
  let nightRows='';
  for(const x of nightItems){
    const v=+x.amount||0; gross+=v;
    if(x.pay_method&&payT.has(x.pay_method)){payT.set(x.pay_method,payT.get(x.pay_method)+v);payN.set(x.pay_method,payN.get(x.pay_method)+1)}
    else unpaid+=v;
    nightRows+='<div class="lin"><span class="dim sm">'+(x.at_time||'')+'</span>'
      +'<b>'+(x.label||'—')+'</b><span class="dim sm">السعر</span>'
      +'<input class="cnt" type="number" min="0" step="0.5" value="'+v+'" style="width:82px" onchange="extraSet(\''+x.id+'\',\'amount\',this.value)">'
      +'<select class="disc-sel" onchange="extraSet(\''+x.id+'\',\'pay_method\',this.value)"><option value="">— الدفع —</option>'
      +PAYMENTS.map(p=>'<option '+(x.pay_method===p?'selected':'')+'>'+p+'</option>').join('')+'</select>'
      +'<span class="grow"></span><span class="lnet">'+v.toFixed(2)+'</span>'
      +'<button class="btn ghost" style="color:var(--red)" onclick="extraDel(\''+x.id+'\')">✕</button></div>';
  }
  const nightSection='<div class="row" style="margin:16px 0 8px;flex-wrap:wrap;gap:6px"><h2 style="margin:0">🌙 إيفا نايت / إيفنت / سوبرنوفا</h2><span class="grow"></span>'
    +'<button class="btn" onclick="quickSale(\'إيفا نايت\',15)">🌙 + إيفا نايت ١٥</button>'
    +'<button class="btn" onclick="quickSale(\'إيفنت\',0)">🎉 + إيفنت</button>'
    +'<button class="btn" onclick="quickSale(\'سوبرنوفا+\',110)">💠 + سوبرنوفا+ ١١٠</button>'
    +'<button class="btn" onclick="quickSale(\'سوبرنوفا\',60)">⭐ + سوبرنوفا ٦٠</button></div>'
    +'<div class="inv"><div class="invb"><div class="lines">'
    +(nightRows||'<div class="dim sm">لا سطور بعد — اضغط زرّاً أعلاه لإضافة إيفا نايت (١٥) أو إيفنت. السعر قابل للتعديل، وكل ضغطة تضيف سطراً.</div>')
    +'</div></div></div>';
  const CT=cafeTotals(), cafeNet=CT.net;
  const net=gross-discT;
  const grand=+(net+cafeNet).toFixed(2);   // إجمالي اليوم شامل الكافيه
  // دمج مدفوعات الكافيه في توزيع التحصيل (بنفس حساب صفحة الكافيه)
  for(const x of (S.extras||[]).filter(y=>!isSaleExtra(y))){
    const a=+x.amount||0, d=DISCOUNTS.find(t=>t.code===(x.discount_code||''));
    const dv=(d&&d.pct!=null&&d.code)?+(a*d.pct/100).toFixed(2):0, v=Math.max(0,a-dv);
    if(x.pay_method&&payT.has(x.pay_method)){payT.set(x.pay_method,payT.get(x.pay_method)+v);payN.set(x.pay_method,payN.get(x.pay_method)+1)}
    else unpaid+=v;
  }
  const payRows=PAYMENTS.filter(p=>payN.get(p)>0).map(p=>

/* ── تقسيم الدفع: نافذة كاملة (عدّل ثم احفظ) ── */
let SPL=null;   // {id, arr:[{n,pay,code}], mainPay, mainCode}
function splitOpen(id){
  const s=S.slots.find(x=>x.id===id);if(!s)return;
  const arr=(s.pay_splits||[]).map(x=>({n:+x.n||1,pay:x.pay||'',code:x.code||'',name:x.name||''}));
  if(!arr.length){
    const pt=partiesOf(s);
    if(pt.length>1)pt.forEach(p=>arr.push({n:+p.players||1,pay:s.pay_method||'',code:'',name:p.name}));
    else arr.push({n:s.actual_players??s._actual??s.booked_players??1,pay:s.pay_method||'',code:discCode(s),name:''});
  }
  const cur=s.actual_players??s._actual??s.booked_players??0;
  const sum=arr.reduce((a,x)=>a+(+x.n||0),0);
  SPL={id,arr,total:Math.max(cur,sum)};    // العدد المحاسَب — قابل للتعديل
  splitRender();
}
function splitClose(){SPL=null;const o=document.getElementById('splitOvl');if(o)o.remove()}
function splitRender(){
  if(!SPL)return;
  const s=S.slots.find(x=>x.id===SPL.id);if(!s)return;
  const total=SPL.total;
  const rate=rateFor(s.start_at,DAY);
  const used=SPL.arr.reduce((a,x)=>a+(+x.n||0),0);
  const rest=total-used;
  const paySel=(v,on)=>`<select class="disc-sel" style="min-width:118px" onchange="${on}">
      <option value="">— طريقة الدفع —</option>
      ${PAYMENTS.map(p=>`<option ${v===p?'selected':''}>${p}</option>`).join('')}</select>`;
  const discSel=(v,on)=>`<select class="disc-sel" style="min-width:130px" onchange="${on}">
      ${DISCOUNTS.map(d=>`<option value="${d.code}" ${v===d.code?'selected':''}>${d.label}</option>`).join('')}</select>`;
  let o=document.getElementById('splitOvl');
  if(!o){o=document.createElement('div');o.id='splitOvl';o.className='ovl';o.onclick=e=>{if(e.target===o)splitClose()};document.body.appendChild(o)}
  const totalNet=SPL.arr.reduce((a,x)=>a+(isFreePay(x.pay)?0:(x.n*rate*(1-((DISCOUNTS.find(d=>d.code===x.code)||{}).pct||0)/100))),0);
  o.innerHTML=`<div class="dlg">
    <h3>تقسيم الدفع — حجز <span class="t">${fmtT(s._t)}</span> · ${shortGame(s.game)}</h3>
    <div class="dim sm">اكتب لكل مجموعة: العدد وطريقة الدفع والخصم. مثال: ٢ سوبر نوفا · ٥ كاش · ٣ كارد</div>
    <div class="rem" style="margin-top:10px">
      <div class="row">
        <b>عدد اللاعبين المحاسَبين</b>
        <input class="cnt" type="number" min="0" max="40" value="${total}" onchange="splitTotal(this.value)">
        <span class="dim sm">(المحجوز ${s.booked_players||0}${s._actual?` · رصد إيفا ${s._actual}`:''})</span>
        <span class="grow"></span>
        <span class="${rest===0?'chip ok':'chip warn'}">${rest===0?'✓ موزّع بالكامل':(rest>0?`باقٍ ${rest}`:`زائد ${-rest}`)}</span>
        ${rest>0?`<button class="btn" onclick="splitAddRow(${rest})">أضف صفاً بالباقي (${rest})</button>`:''}
        ${rest<0?`<button class="btn" onclick="splitTotal(${used})">اجعل العدد ${used}</button>`:''}
      </div>
    </div>
    <div style="margin-top:12px">
      ${SPL.arr.map((x,i)=>`<div class="splitrow">
        <input class="cnt n" type="number" min="1" max="40" value="${x.n}" onchange="splitSet(${i},'n',this.value)">
        <span class="dim sm">لاعب</span>
        ${x.name?`<b style="min-width:92px">${x.name}</b>`:''}
        ${paySel(x.pay,`splitSet(${i},'pay',this.value)`)}
        ${discSel(x.code,`splitSet(${i},'code',this.value)`)}
        <span class="grow"></span>
        <span class="t">${(isFreePay(x.pay)?0:(x.n*rate*(1-((DISCOUNTS.find(d=>d.code===x.code)||{}).pct||0)/100))).toFixed(2)}</span>
        <button class="btn ghost" style="color:var(--red)" onclick="splitDel(${i})">✕</button>
      </div>`).join('')}
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn" onclick="splitAddRow()">+ إضافة صف</button>
      <span class="grow"></span>
      <span class="dim sm">صافي الحجز</span><b class="t" style="font-size:17px">${totalNet.toFixed(2)}</b>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn primary" onclick="splitSave()">حفظ</button>
      <button class="btn" onclick="splitClose()">إلغاء</button>
      <span class="grow"></span>
      <button class="btn ghost" style="color:var(--red)" onclick="splitClear()">مسح التقسيم</button>
    </div>
  </div>`;
  sweep(o);
}
function splitSet(i,field,v){
  if(!SPL||!SPL.arr[i])return;
  SPL.arr[i][field]=field==='n'?Math.max(1,+v||1):v;
  splitRender();
}
function splitTotal(v){if(SPL){SPL.total=Math.max(0,+v||0);splitRender()}}
function splitAddRow(n){if(SPL){SPL.arr.push({n:Math.max(1,+n||1),pay:'',code:'',name:''});splitRender()}}
function splitDel(i){if(SPL){SPL.arr.splice(i,1);splitRender()}}
function splitClear(){if(SPL){SPL.arr=[];splitSave()}}
async function splitSave(){
  if(!SPL)return;
  const {id,arr,total}=SPL;
  const clean=arr.filter(x=>+x.n>0);
  const sum=clean.reduce((a,x)=>a+(+x.n||0),0);
  const body={pay_splits:clean.length?clean:null};
  // العدد المحاسَب = مجموع الصفوف (فلا يبقى «باقٍ» غامض)
  body.actual_players=clean.length?sum:(total||null);
  try{
    await sbPatch('slots',id,body);
    const s=S.slots.find(x=>x.id===id);
    if(s){s.pay_splits=body.pay_splits;s.actual_players=body.actual_players;}
    splitClose();compute();renderAll();status('✓ حُفظ التقسيم');
  }catch(e){status(/pay_splits|column/.test(e.message)?'⚠ شغّل ملف eva_v4.sql في Supabase أولاً — عمود تقسيم الدفع غير موجود':'⚠ '+e.message)}
}

async function setDiscCode(id,code){

async function setDiscount(id,v){

function exportCSV(){
  const out=[['S.NO','الوقت','رقم الطلب','الحساب','اللعبة','محجوز','لعبوا','سعر الفرد','المبلغ','كود الخصم','الخصم','الصافي','الدفع','ملاحظة']];
  let idx=0;const payTotals=new Map(PAYMENTS.map(p=>[p,0]));let payUnset=0;
  for(const item of timeline()){
    if(item.walkin){const w=item.walkin;const rate=rateFor(new Date(w.start).toISOString(),DAY);const amt=w.players*rate;
      out.push(['',fmtT(w.start),'','','بدون حجز','',w.players,rate,amt.toFixed(2),'','',amt.toFixed(2),'غير محصّل؟','تقديري']);continue}
    const s=item.slot;
    if(s._cancelled){out.push(['',fmtT(s._t),'',s.account_name||'',shortGame(s.game),s.booked_players||0,'','','','أُلغي من إيفا','','','','']);continue}
    if(s._swallowed&&Date.now()>s._endT&&!s.pay_method){out.push(['',fmtT(s._t),'',s.account_name||'',shortGame(s.game),s.booked_players||0,'','','','لم يحضر — لا يُحصَّل','','','','']);continue}
    idx++;
    const c=saleCalc(s);
    const playedN=s.actual_players??s._actual??'';
    const parts=c.parts.filter(p=>p.n>0);
    parts.forEach((p,i)=>{
      if(p.pay&&payTotals.has(p.pay))payTotals.set(p.pay,payTotals.get(p.pay)+p.net);else if(!p.pay)payUnset+=p.net;
      const d=DISCOUNTS.find(x=>x.code===p.code);
      out.push([i===0?idx:'',fmtT(s._t),i===0?(s.order_no||''):'',i===0?(s.account_name||''):'↳ تقسيم',
        i===0?shortGame(s.game):'',i===0?(s.booked_players||0):'',p.n,c.rate,p.amt.toFixed(2),
        d&&d.code?d.label:'',p.disc?p.disc.toFixed(2):'',p.net.toFixed(2),p.pay,i===0?(s.sale_note||''):'']);
    });
  }
  for(const x of (S.extras||[]).filter(isSaleExtra)){
    const v=+x.amount||0;
    if(x.pay_method&&payTotals.has(x.pay_method))payTotals.set(x.pay_method,payTotals.get(x.pay_method)+v);else payUnset+=v;
    out.push(['','','','مبيعات إضافية',x.label||'','',x.qty||1,'',v.toFixed(2),'','',v.toFixed(2),x.pay_method||'',x.note||'']);
  }
  out.push([]);out.push(['','مجموع الدفع']);out.push(['','الطريقة','Total']);
  for(const p of PAYMENTS){const v=payTotals.get(p);if(v)out.push(['',p,v.toFixed(2)])}
  if(payUnset)out.push(['','غير محدد',payUnset.toFixed(2)]);
  const csv='﻿'+out.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`مبيعات-${DAY}.csv`;a.click();
  status('⬇ صُدّر ملف Excel (CSV)');
}



/* إجماليات الجلسات (بلا كافيه) — يستعملها التقرير المجمّع */
function sessionTotals(){
  const byPay=new Map(PAYMENTS.map(p=>[p,0])); let gross=0,disc=0,unset=0,n=0;
  for(const s of S.slots){
    if(s._cancelled)continue;
    if(s._swallowed&&Date.now()>s._endT&&!s.pay_method)continue;
    const c=saleCalc(s); gross+=c.amt; disc+=c.disc; n++;
    for(const p of c.parts){ if(!p.n)continue;
      if(p.pay&&byPay.has(p.pay))byPay.set(p.pay,byPay.get(p.pay)+p.net); else if(!p.pay)unset+=p.net; }
  }
  return {byPay,gross,disc,net:gross-disc,unset,n};
}

/* ═════════ الكافيه ═════════ */
let CART=[], CAFE_CAT='hot';
function cafeTotals(){
  const byPay=new Map(PAYMENTS.map(p=>[p,0])), byItem=new Map(); let gross=0,disc=0,unset=0;
  for(const x of (S.extras||[])){
    if(isSaleExtra(x))continue;
    const a=+x.amount||0, d=DISCOUNTS.find(t=>t.code===(x.discount_code||''));
    const dv=(d&&d.pct!=null&&d.code)?+(a*d.pct/100).toFixed(2):0, v=Math.max(0,a-dv);
    gross+=a;disc+=dv;
    if(x.pay_method&&byPay.has(x.pay_method))byPay.set(x.pay_method,byPay.get(x.pay_method)+v);else unset+=v;
    const k=x.label||'—', e=byItem.get(k)||{q:0,v:0}; e.q+=(+x.qty||1); e.v+=v; byItem.set(k,e);
  }
  return {byPay,byItem,gross,disc,net:gross-disc,unset};
}
function cafeAddItem(n,p){
  const f=CART.find(x=>x.n===n);
  if(f)f.q++;else CART.push({n,p,q:1});
  renderCafe();
}
function cartQty(i,d){const it=CART[i];if(!it)return;it.q+=d;if(it.q<=0)CART.splice(i,1);renderCafe()}
function cartClear(){CART=[];renderCafe()}
async function cartSave(){
  if(!CART.length){status('السلّة فارغة');return}
  const pay=(document.getElementById('cartPay')||{}).value||null;
  const code=(document.getElementById('cartDisc')||{}).value||null;
  const at=fmtT(Date.now());
  const rows=CART.map(x=>({day:DAY,label:x.n,qty:x.q,amount:+(x.p*x.q).toFixed(2),
    pay_method:pay,discount_code:code,at_time:at,note:CAFE_CATS[cafeCatOf(x.n)]||''}));
  try{
    await sbInsert('extra_sales',rows);
    S.extras=await sbGet('extra_sales?day=eq.'+DAY+'&order=created_at&select=*');
    // خصم المخزون تلقائياً للأصناف المتتبَّعة فقط
    const dec={};
    for(const x of CART){const k=stockKeyOf(x.n); if(stockQty(k)!=null)dec[k]=(dec[k]||0)+x.q;}
    const upd=Object.keys(dec).map(k=>({item:k,qty:stockQty(k)-dec[k]}));
    if(upd.length){try{await sbUpsert('cafe_stock',upd,'item');S.stock=await sbGet('cafe_stock?select=item,qty').catch(()=>S.stock);}catch(e){}}
    CART=[];renderCafe();renderSales();renderRep();status('✓ سُجّل طلب الكافيه');
  }catch(e){status(/extra_sales|discount_code|at_time/.test(e.message)?'⚠ شغّل ملف eva_v4.sql في Supabase أولاً':'⚠ '+e.message)}
}
function stockQty(item){const r=(S.stock||[]).find(x=>x.item===item);return r?+r.qty:null}
async function stockAdd(){
  const item=(document.getElementById('stkItem')||{}).value;
  const amt=+((document.getElementById('stkAmt')||{}).value)||0;
  if(!item||!amt){status('اختر الصنف والكمية');return}
  try{
    await sbUpsert('cafe_stock',[{item,qty:(stockQty(item)||0)+amt}],'item');
    S.stock=await sbGet('cafe_stock?select=item,qty').catch(()=>S.stock||[]);
    renderCafe();status('✓ أُضيف للمخزون');
  }catch(e){status(/cafe_stock/.test(e.message)?'⚠ شغّل ملف cafe_stock.sql في Supabase أولاً':'⚠ '+e.message)}
}

function slotEmails(s){
  const set=new Set();
  if(s.email)set.add(s.email);
  for(const p of (s.roster||[])){const e=S.dir.get(p.name);if(e)set.add(e)}
  for(const g of s._games)for(const p of g.players)if(p.email)set.add(p.email);
  return[...set];
}

              <button class="btn danger" onclick="markSent('${s.id}',true)">لم يُرسَل — علّم أُرسل</button>
              <button class="btn" onclick="recStatus('${s.id}','declined')" title="العميل لا يريد التسجيل">🚫 لا يريد</button>

    </tr>`;
  }).join('');

    ${rows}
  </table></div>`;
  sweep(el);

    <tr><td>حجوزات باسم موظف</td><td>${staffB.length}</td><td class="dim sm">${staffB.map(s=>fmtT(s._t)+' '+(s.account_name||'')).join('، ')||'—'}</td></tr>
    <tr><td>تسجيلات لم تُرسَل</td><td>${unsent}</td><td class="dim sm">${unsent?'راجع تبويب التسجيلات':'كلها أُرسلت ✓'}${declinedRec?` · ${declinedRec} لا يريدون التسجيل`:''}</td></tr>
    <tr><td>الألعاب</td><td>${byGame.size}</td><td class="dim sm">${[...byGame].map(([g,e])=>`${g}: ${e.n} حجز / ${e.p}👤`).join(' · ')}</td></tr>
    <tr><td>طاقم اليوم</td><td>${S.gms.length}</td><td class="dim sm">${gmLine}</td></tr>
  </table></div>`;
  sweep(el);
}

async function extraAdd(){
  const label=(document.getElementById('exLabel').value||'').trim();
  const amount=+document.getElementById('exAmt').value||0;
  if(!label||!amount){status('اكتب البند والمبلغ');return}
  const row={day:DAY,label,qty:+document.getElementById('exQty').value||1,amount,
    pay_method:document.getElementById('exPay').value||null,
    note:(document.getElementById('exNote').value||'').trim()||null};
  try{
    await sbInsert('extra_sales',row);
    S.extras=await sbGet(`extra_sales?day=eq.${DAY}&order=created_at&select=*`);
    renderRep();renderSales();status('✓ أُضيف السطر');
  }catch(e){status(/extra_sales/.test(e.message)?'⚠ شغّل eva_v4.sql في Supabase أولاً (جدول المبيعات الإضافية)':'⚠ '+e.message)}
}
async function extraSet(id,field,v){
  const val=(field==='amount'||field==='qty')?(+v||0):((v||'').trim()||null);
  try{
    await sbPatch('extra_sales',id,{[field]:val});
    const x=(S.extras||[]).find(e=>e.id===id);if(x)x[field]=val;
    renderRep();renderSales();renderCafe();sweep(document.querySelector('main'));status('✓ حُفظ');
  }catch(e){status(/at_time|column/.test(e.message)?'⚠ شغّل ملف eva_v4.sql في Supabase أولاً':'⚠ '+e.message)}
}
async function cafeAdd(){
  const amount=+document.getElementById('cafeAmt').value||0;
  if(!amount){status('اكتب المبلغ');return}
  const row={day:DAY,label:'café',qty:1,amount,at_time:fmtT(Date.now()),
    pay_method:document.getElementById('cafePay').value||null,
    discount_code:document.getElementById('cafeDisc').value||null};
  try{
    await sbInsert('extra_sales',row);
    S.extras=await sbGet(`extra_sales?day=eq.${DAY}&order=created_at&select=*`);
    renderSales();renderRep();status('✓ أُضيف سطر كافيه');
  }catch(e){status(/extra_sales|discount_code|at_time/.test(e.message)?'⚠ شغّل ملف eva_v4.sql في Supabase أولاً':'⚠ '+e.message)}
}
async function extraDel(id){
  try{await sbDelete('extra_sales',`id=eq.${id}`);
    S.extras=(S.extras||[]).filter(x=>x.id!==id);renderRep();renderSales();renderCafe();sweep(document.querySelector('main'));status('✓ حُذف السطر')}
  catch(e){status('⚠ '+e.message)}
}
async function quickSale(label,amount){
  const row={day:DAY,label,qty:1,amount:+amount||0,at_time:fmtT(Date.now()),pay_method:null};
  try{
    await sbInsert('extra_sales',row);
    S.extras=await sbGet(`extra_sales?day=eq.${DAY}&order=created_at&select=*`);
    renderSales();renderRep();sweep(document.querySelector('main'));status('✓ أُضيف سطر '+trText(label));
  }catch(e){status(/extra_sales/.test(e.message)?'⚠ شغّل ملف eva_v4.sql في Supabase أولاً':'⚠ '+e.message)}
}
